# Dependabot — обновления зависимостей бота (DRF-1396).
#
# ─────────────────────────────────────────────────────────────────────
# Почему этот файл вообще появился
# ─────────────────────────────────────────────────────────────────────
# 03.09 образ пилота собрался, переразрешив диапазоны, и уехал на 78
# пакетов мимо `uv.lock` — семь на целый мажор, включая django-redis
# 6→7, на котором держатся ограничители частоты. Сборку починили
# (строго по локу + страж), но источник остался: закрепления никто не
# двигает осознанно, поэтому они двигаются сами при первой же пересборке.
#
# Dependabot здесь — не «свежесть ради свежести», а механизм, который
# делает движение версий видимым и подконтрольным: PR → CI → человек.
#
# ─────────────────────────────────────────────────────────────────────
# target-branch: dev — и почему это не косметика
# ─────────────────────────────────────────────────────────────────────
# Умолчальная ветка репозитория — `main`, и её последний коммит от
# 19.05.2026; `dev` впереди на 1036 коммитов. Без `target-branch`
# Dependabot читал бы манифесты `main` и открывал PR'ы в `main` —
# то есть отчитывался бы о состоянии, которое не выкладывается.
#
# Цена решения, названная прямо: при заданном `target-branch`
# GitHub НЕ создаёт Dependabot security updates для этих экосистем —
# security-PR'ы поднимаются только против умолчальной ветки. Алерты
# продолжают приходить (мы их и читаем через API), но автоматический
# «патч приехал сам» здесь работает через version-обновления ниже.
#
# Настоящее лекарство — сделать `dev` умолчальной веткой репозитория.
# Это настройка репозитория, а не файла; решение за владельцем.
# До тех пор конфиг ниже — лучшее, что достижимо из PR.
#
# ─────────────────────────────────────────────────────────────────────
# Частота и группировка — расчёт, а не вкус
# ─────────────────────────────────────────────────────────────────────
# Непрочитанный поток PR'ов хуже тишины: он приучает не смотреть.
# Потолок — пять PR'ов в первую неделю, дальше меньше.
#
#   uv             еженедельно   ≤ 2 PR  (patch и minor раздельно)
#   npm (miniapp)  ежемесячно    ≤ 2 PR  (runtime и dev раздельно)
#   github-actions ежемесячно    ≤ 1 PR
#   ─────────────────────────────────────
#   первая неделя  ≤ 5     дальше ≤ 2/нед
#
# Patch и minor разведены намеренно. Patch — почти всегда безопасно
# и мержится быстро; minor — то, где живёт поведенческий дрейф
# (django-redis 6→7 был мажором, но minor'ы ломают не реже). Один
# общий PR смешал бы их и заставил держать безопасное заложником
# спорного.
#
# Мажоры исключены у всех экосистем: `ignore` ниже. Мажор — это
# отдельное решение с отдельным обоснованием, а не строка в списке.
#
# Docker намеренно НЕ подключён. Базовый слой зеркалится в GHCR
# (`.github/workflows/mirror-base-image.yml`), и автоподъём тега
# конфликтовал бы с зеркалом; образы в compose (postgres:16-alpine,
# redis:7-alpine, chromadb/chroma) — инфраструктура пилота, её
# двигают руками вместе с выкладкой.
version: 2

updates:
  # ───────────────────────────────────────────────────────────────
  # Python — pyproject.toml + uv.lock
  # ───────────────────────────────────────────────────────────────
  # Сборка образа идёт строго по uv.lock, поэтому дифф лока в PR —
  # ровно то, что поедет на пилот. Это делает ревью осмысленным:
  # видно каждый сдвиг, а не «диапазон разрешился как-нибудь».
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    ignore:
      # Мажоры — руками, с обоснованием по каждому.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # ───────────────────────────────────────────────────────────────
  # Mini App — apps/miniapp/package-lock.json
  # ───────────────────────────────────────────────────────────────
  # Ежемесячно: мини-апп собирается в браузер, у него нет доступа к
  # БД и токенам, и большая часть его алертов — на сборочном
  # инструменте (vite, esbuild, postcss), который до продакшена не
  # доезжает. Недельный ритм здесь дал бы шум без выигрыша.
  #
  # Runtime и development разведены, потому что у них разный вес:
  # react-router правит навигацию живого мини-аппа, vite — только
  # машину разработчика и CI.
  - package-ecosystem: "npm"
    directory: "/apps/miniapp"
    target-branch: "dev"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "miniapp"
    groups:
      miniapp-runtime:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      miniapp-dev:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # ───────────────────────────────────────────────────────────────
  # GitHub Actions — .github/workflows/*
  # ───────────────────────────────────────────────────────────────
  # Дёшево и полезно: экшены ходят по подвижным тегам (@v4, @v5),
  # то есть уже сегодня выполняют код, который никто не закреплял.
  # Один PR в месяц на все — этого достаточно.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"
