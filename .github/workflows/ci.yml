name: ci

# DRF-1377 — the push trigger no longer follows topic branches.
#
# Measured 25.08 at 01:20 UTC: 37 of the last ~50 commits ran `ci` TWICE,
# once for `push` on the topic branch and once for `pull_request` on the
# same SHA, byte-identical work on the same runner pool. That is where the
# «45m21s against a 45m ceiling» came from — not a slow suite, two runs
# elbowing each other.
#
# Grouping the two events together cannot fix this: whichever run lost the
# race would report `cancelled` on the PR, which reads as «somebody skipped
# it» (DRF-1373). The duplication has to die at the trigger instead.
#
# `replay.yml` has always listed only `main` and `dev` here, and its history
# shows exactly one run per PR SHA. This makes `ci` match it.
#
# Trade-off, stated plainly: pushing a topic branch with no PR open now runs
# nothing. Open the PR (or use `workflow_dispatch`) to get a verdict. Pushes
# to `dev`/`main` still run — that is the post-merge gate and it is the half
# that must never be skipped.
on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# DRF-1377 — keyed on the PR number, and cancelling restricted to PRs.
#
# The old group was `ci-${{ github.ref }}` with an unconditional
# `cancel-in-progress: true`. On `dev` every ref is the same string, so each
# merge cancelled the CI run of the merge before it. Measured over the last
# 20 pushes to `dev`: 15 cancelled, 4 green. Three quarters of everything
# that landed did so with no verdict, and the evidence was invisible because
# GitHub renders a cancelled run grey, not red — the same trap DRF-1373 found
# in `replay.yml`. Commit a18ca029 (the DRF-1310 LLM-client fix) is one of
# the fifteen.
#
# So:
#   * `github.event.pull_request.number` groups a PR with itself. A new
#     commit makes the previous run's verdict meaningless, so superseding it
#     is honest work, and that is the only case `cancel-in-progress` covers.
#   * `github.sha` gives every push its own group. A burst of merges to `dev`
#     can no longer collide, and with cancelling off for `push` it could not
#     act even if it did. Landed code always gets its own verdict.
#
# Not `github.workflow`: `ci-docs-skip.yml` is also named `ci`, so that
# expression is ambiguous across the two files. The literal prefix is not.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest
    # DRF-1121 bumped this from 15 to 45: the new "pytest apps/ (full
    # suite)" step alone measured ~30 min against Postgres locally
    # (7246 tests). Flagged for tech-lead confirmation in
    # REPORT_MECHANIZATION.md — a real CI-feedback-latency tradeoff,
    # not a free win.
    #
    # DRF-1253 left it at 45 and recorded: the whole job "measured
    # 26m05s ... The headroom is real; do not spend it."
    #
    # DRF-1381 — THAT CONCLUSION IS DEAD, AND THAT IS THE LESSON.
    # It was true the day it was written. Nothing re-checked it while
    # the thing it described changed underneath: the same job now
    # measures a 42.5 min median, +63% on the 26m05s quoted above. The
    # sentence stayed confident, so three PRs were debugged for a
    # failure that was really this line.
    #
    # MEASURED 25.08 from the GitHub jobs API. JOB duration
    # (`started_at` -> `completed_at` of this job), NOT run duration:
    # a run's `createdAt` -> `updatedAt` includes queue time and this
    # repo has `success` runs with 89 min of wall-clock. Sample = the
    # last 60 `ci` runs, all after DRF-1377 de-duplicated the triggers,
    # so this is the suite's own cost and not two runs elbowing each
    # other on one runner pool.
    #
    #   19 runs finished the job:  min 36.7   median 42.5   max 44.9
    #   11 runs were killed by THIS ceiling, all at 45.2-45.4 min
    #
    #   (19 further runs were cancelled by `concurrency`, not by the
    #   clock — they stop early by design and carry no duration
    #   information, so they are excluded rather than averaged in.)
    #
    # READ THE SECOND LINE BEFORE TRUSTING THE FIRST. Of the 30 runs
    # allowed to do the work, 11 — 37% — hit the ceiling. So "max
    # observed = 44.9" is not the maximum of anything: the distribution
    # is CENSORED at 45, and its entire upper tail was deleted before
    # it could be recorded. Sizing a new ceiling off 44.9 would repeat
    # the DRF-1253 mistake with fresher-looking numbers.
    #
    # Fitting a censored (Tobit) normal to all 30 observations — the 19
    # exact durations plus the 11 "longer than 45" facts — recovers the
    # distribution this ceiling has been hiding:
    #
    #   mu = 44.15 min      sigma = 2.64 min
    #
    # Cross-check before using it: that fit predicts 37.4% of runs
    # exceeding 45 min, against 36.7% observed. It reproduces the
    # failure it is being used to size away from, so its tail is worth
    # quoting — p99 = 50.3 min, p99.9 = 52.3 min.
    #
    # 45 was therefore never a ceiling over this suite. It sits 0.3
    # sigma above the median: a coin-flip the suite happens to win
    # about six times in ten. PRs #1275, #1278 and #1282 each lost it
    # once overnight on healthy code — 45 wasted minutes and a manual
    # restart apiece.
    #
    # THE NEW NUMBER, AND WHERE IT COMES FROM:
    #
    #   p99.9 of the fitted distribution          52.3 min
    #   + one infrastructure stall                 +7.2 min
    #       measured, not guessed: the observed
    #       peak-to-trough spread of the single
    #       `pytest apps/` step, 1932s .. 2366s
    #       across these same runs
    #   = 59.5 min, rounded up to the 5-min grid   60 min
    #
    # Not a round number that felt roomy — 60 is where that arithmetic
    # lands. Under the fit it is ~6 sigma out.
    #
    # THE TRADE-OFF, STATED PLAINLY: a job that genuinely hangs now
    # burns 60 runner-minutes before the clock kills it instead of 45.
    # That is the price of the ceiling no longer firing on healthy
    # runs, and it is the right side to err on: a hang is rare, 37% of
    # honest runs dying was not.
    #
    # WHAT THIS DOES NOT DO: it does not make the suite faster, and it
    # is not meant to. 88% of the job is one step — `pytest apps/`, a
    # 2266s median — running single-process, with `pytest-xdist` absent
    # from the dependency tree entirely. Dependency install is NOT the
    # cost (`uv sync --frozen` is 3s; the uv cache works). Making the
    # suite faster is its own ticket with its own measurement, and is
    # deliberately not attempted here.
    #
    # WHEN TO RE-MEASURE — do not inherit this block as fact the way
    # DRF-1253's sentence was inherited. It is sized against a 42.5 min
    # median and a fitted mu of 44.15 min as of 25.08.2026. If the
    # median job passes ~50 min, the margin computed above is spent and
    # this number is stale again. Re-measure from the jobs API. Do not
    # assume.
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_bot_platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d ai_bot_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-test-secret-do-not-use-in-prod
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_bot_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ci-fake-key-not-real

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # DRF-1275 — secret guard. Before this ticket `detect-secrets` was
      # declared ONLY in .pre-commit-config.yaml (`rev: v1.5.0`), so it
      # defended exactly one population: engineers who had actually run
      # `uv run pre-commit install`. It defended nobody in a fresh
      # worktree or clone, nothing committed through the GitHub web UI,
      # and nothing committed with `--no-verify`. `.secrets.baseline` was
      # maintained but never enforced by anything automatic.
      #
      # The blast radius is worse here than in the Ayla backend: the bot
      # is deployed by hand (a bundle is copied onto the host), so a
      # leaked credential first surfaces on a live machine rather than in
      # a pipeline.
      #
      # WHY FIRST IN THE JOB: the same argument that keeps the "eventbus
      # booking lifecycle tests" step below as its own fast-fail gate — a
      # cheap gate must not sit behind "pytest apps/ (full suite)"
      # (~30 min). Measured on ubuntu-latest: the three steps below add
      # ~2 min to a green run (the scan itself is ~1m45s over ~1800
      # tracked files), and turn a leaked-credential run red at ~2 min
      # instead of ~25. That ~2 min is a real, recurring cost on every
      # push — recorded here rather than buried, same as the
      # CI-feedback-latency note on `timeout-minutes` above.
      #
      # Placing it above `uv sync` also means the guard still runs when
      # the private-dep fetch (GH_DEPLOY_TOKEN) is broken, which is
      # precisely a moment when credentials are being moved around.
      - name: Set up Python 3.12 (secret guard)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        # Pinned to the SAME version as `rev: v1.5.0` of the
        # Yelp/detect-secrets hook in .pre-commit-config.yaml. Different
        # releases ship different plugins and filters, so an unpinned CI
        # would drift away from the local hook silently — the one failure
        # mode a second copy of a guard must not have.
        #
        # No `# pragma: allowlist secret` is needed on the pin: verified
        # against v1.5.0's own plugin set that `detect-secrets==1.5.0`
        # under a `run:` key does not trip the Secret Keyword heuristic.
        # (The Ayla backend needed one because its pin sits inside a
        # `run: |` block scalar.) Do not add a pragma speculatively — it
        # would blind this line to a real secret later.
        run: pip install "detect-secrets==1.5.0"

      - name: detect-secrets (baseline audit)
        # `detect-secrets-hook` is the GATING entry point: it exits
        # non-zero on any secret that is not already recorded in
        # `.secrets.baseline`. (`detect-secrets scan --baseline` only
        # rewrites the baseline file; it does not fail a build.)
        #
        # The baseline is deliberately NOT regenerated here. Regenerating
        # it in CI would silently bless whatever had already leaked —
        # that is how junk gets INTO a baseline, not how it gets fixed.
        #
        # EXCLUSIONS: the grep alternation below is a literal
        # transcription of the `exclude:` block of the `detect-secrets`
        # hook in .pre-commit-config.yaml — same branches, same `^(...)$`
        # anchoring, verbose-mode whitespace removed. Keeping one list in
        # two files is a known hazard, so the rule is: if you touch one,
        # touch the other in the same commit. A hook and a pipeline that
        # disagree about WHICH paths are exempt produce two truths (green
        # locally / red in CI, or worse the reverse), which is a defect in
        # its own right.
        #
        # The one intended difference is SCOPE, not rules: pre-commit
        # sees staged files only, CI sees every tracked file — CI is the
        # wider net over an identical exemption set.
        run: |
          git ls-files \
            | grep -vE '^(\.secrets\.baseline|uv\.lock|.*\.lock|tests/fixtures/.*|legacy_maxbot/.*|legacy_formulatela_mcp/.*|legacy_notifications/.*)$' \
            | xargs detect-secrets-hook --baseline .secrets.baseline

      # postgresql-client (pg_dump / pg_restore) needed for
      # apps/identity/tests/test_backup_restore.py — the test verifies
      # ADR-0011 §11.1 invariant (tombstoned entries stay unreadable
      # after restore). Without these binaries the test self-skips via
      # `shutil.which('pg_dump') is None`, so the gate is defence-in-
      # depth: install here so CI exercises the real backup cycle; the
      # skipif keeps local dev (Windows, minimal Docker) from breaking.
      - name: Install postgresql-client (for backup-restore test)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # ayla-ai-core lives in a separate private repo. CI auths via the
      # GH_DEPLOY_TOKEN secret (read-only PAT scoped to that repo). The
      # `insteadOf` rewrite makes `git+https://github.com/.../ayla-ai-core`
      # in pyproject.toml resolve to `https://x-access-token:<token>@...`
      # at fetch time without leaking the token into the lockfile.
      #
      # K12 (DRF-570) pins `ayla-ai-core==v0.6.0` exactly — `--frozen`
      # makes any drift a hard CI failure (the lockfile must match).
      - name: Configure git auth for private deps
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          if [ -n "$GH_DEPLOY_TOKEN" ]; then
            git config --global url."https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "::error::GH_DEPLOY_TOKEN secret missing — ayla-ai-core fetch will fail. Set the secret in repo settings."
            exit 1
          fi

      - name: uv sync (with ai-core extra)
        run: uv sync --extra dev --extra ai-core --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      # Red-zone direct-access guard — AST lint that blocks
      # `MemoryEntry.objects.filter(sensitivity_zone='red')` and
      # related patterns outside the sanctioned `RedZoneReader`
      # accessor. First line of defence per ADR-0011 §10 (RLS policy
      # is the final line). See `tools/lint/red_zone_guard.py`
      # docstring for what is + is not detected.
      - name: Red-zone guard (AST lint)
        run: uv run python tools/lint/red_zone_guard.py apps/

      # ADR-0009 G-series module-boundary guard — source-scoped
      # forbidden-import-edge lint (#1001, Option B). Encodes G2.1
      # (skills↛yclients), G5.1 (api↛booking mutators), G6.2
      # (eventbus consumer↛skills/channels), G9 (BookingRequest read
      # outside apps/booking/ — DRF-1109, dual-source-with-Ayla risk)
      # + the cross-repo psycopg2 ban (rule 2). Replaces the
      # never-created `.importlinter` baseline. See
      # `tools/lint/import_boundaries.py` for the
      # contracts, the on-`dev` baseline, and what is NOT detected.
      - name: Import-boundary guard (AST lint)
        run: uv run python tools/lint/import_boundaries.py apps/

      # Consent-column direct-read guard (DRF-1314). `BotUser.consent_at`
      # is a denormalised stamp that `consent.services.withdraw()`
      # deliberately never clears, so it answers "ever consented", not
      # "may we write to them". Reads outside the shared gate, the two
      # stamping sites and the operator census are refused. See
      # `tools/lint/consent_column_guard.py` for what is + is not
      # detected — notably it cannot catch a surface with NO gate, which
      # is what DRF-1301 and DRF-1307 actually were.
      - name: Consent-column direct-read guard (AST lint)
        run: uv run python tools/lint/consent_column_guard.py apps/

      # Mini App style contract (DRF-1066). A class name written in a
      # screen and never given a rule renders as nothing: on 2026-08-14
      # that turned the booking payment block into
      # «Оплатить на местеНаличными или картой в салоне» and nobody saw
      # it until a person did. It cannot be caught by vitest -- that
      # suite runs with `css: false`, so a stylesheet read inside a test
      # comes back empty and every assertion over it passes vacuously.
      # Runs in this job rather than the `miniapp` one because it is a
      # text lint and needs no Node. Accepted debt is baselined in the
      # script and can only shrink.
      - name: Mini App style contract
        run: uv run python tools/lint/miniapp_style_contract.py apps/miniapp

      # Personal-field owner guard (DRF-1365). The memory audit of
      # 2026-08-24 returned «C — multiple competing memory systems»: six
      # stores holding facts about the same person, none of them designed
      # as a memory, all of them grown one field at a time. This lint
      # refuses the next one: every slot that is keyed to a person and
      # read back to shape what Ayla says must declare its origin, its
      # owner and whether it follows the person between salons — in
      # `apps/identity/personal_fields.py`. The crossing claim is checked
      # against the store's own tenancy, and the owner's ruling of
      # 2026-08-24 («сказал сам — переходит; узнали о нём — нет») is
      # enforced. Today's exceptions are named individually in
      # POLICY_DEBT and can only shrink. See the script docstring for the
      # criterion and for what it deliberately does NOT detect.
      - name: Personal-field owner guard (AST lint)
        run: uv run python tools/lint/personal_field_guard.py apps/

      - name: Django manage.py check
        run: uv run python manage.py check

      # Fail the build if a model change has no matching migration.
      # Prevents the kind of drift (#1030) that accumulates silently
      # because the suite doesn't otherwise exercise `makemigrations`.
      - name: Migration drift guard (makemigrations --check)
        run: uv run python manage.py makemigrations --check --dry-run

      - name: pytest tests/smoke/
        run: uv run pytest tests/smoke/ -v

      # ---------------------------------------------------------------
      # DRF-1253 — the rest of `tests/`.
      #
      # `pyproject.toml` declares `testpaths = ["tests", "apps"]`, but CI
      # only ever ran `tests/smoke/` (6 files). The other 26 test files
      # under `tests/` — 487 tests — never executed anywhere except on
      # whoever remembered to run them locally. `mypy apps config tests`
      # below type-checked them, which is exactly the trap: they looked
      # covered and defended nothing.
      #
      # Measured against Postgres 16 (NOT SQLite — see cause (a) below
      # for why that distinction is the whole story): 440 passed, 9
      # skipped, 38 deselected. Four runs before merge — three locally
      # on Windows (~2.5 min each) and one on this runner (57.77s) —
      # all with identical counts. 21 of the 26 files are green as-is.
      #
      # The 9 skips are by design, not gaps:
      #   - tests/e2e/test_ayla_integration.py (8) self-skips without
      #     AYLA_BASE_URL + a credential; its own docstring says
      #     "CI default = skip".
      #   - tests/e2e/test_replay_diff_vs_mysite.py (1) skips until the
      #     mysite ground-truth fixture is present.
      # Both print a skip reason, so a regression into "skipped" shows
      # in the log rather than passing as green.
      #
      # `--ignore=tests/smoke` leaves the fast smoke gate above as its
      # own step instead of running those 6 files twice.
      #
      # No `-q` here on purpose. `addopts` in pyproject.toml is already
      # `-q -m "not smoke"`; a second `-q` makes it `-qq`, which
      # suppresses the final `N passed` line — a failure then reads like
      # a success. (The `pytest apps/ -q` step below has exactly that
      # problem today. Out of scope for this ticket, worth its own.)
      #
      # ─── Deselected: 38 tests, 4 root causes, none introduced here ──
      # Every one reproduced on Postgres and filed separately. Deselects
      # are node-ID-scoped, not file-scoped, so the 206 passing tests
      # that live *inside* those five files still run — above all the
      # 186 green cases of the cross-tenant leakage scanner, which
      # guards a security invariant and is worth keeping in CI.
      #
      # (a) 34 x tests/integration/test_cross_tenant_leakage.py — the
      #     generic `_create_row` factory (`_MODEL_REQUIRED_FIELDS`) is
      #     wrong on Postgres and only on Postgres:
      #       31 x StringDataRightTruncation — the factory appends
      #            "-{Model}-{n}" to a base value and overflows
      #            varchar(16) columns (TenantStaff.role receives
      #            "admin-TenantStaff-1", 19 chars).
      #        3 x NotNullViolation — StaffInvite.expires_at is NOT NULL
      #            with no default and the factory never supplies it.
      #     SQLite enforces neither, which is why this file read as
      #     green for as long as it sat outside CI. Test-side fix.
      # (b) 2 x tests/e2e/ (test_max_echo, test_handoff_skill) — both
      #     assert the bot echoes the user's text back verbatim; DRF-963
      #     replaced verbatim echo with the "Я пока не понял" fallback.
      #     This is DRF-1217. For whoever picks that up: it is 2 tests
      #     in 2 files, not the 4 the ticket assumes, and in
      #     test_handoff_skill.py only the last line (197) fails — the
      #     handoff flow it is named for passes.
      # (c) 1 x tests/e2e/test_privacy_skill.py — asserts that a chat
      #     "удали мои данные" hard-deletes the BotUser. DRF-956 / T-05
      #     deliberately turned that into a redirect to the Mini App
      #     confirmed flow ("Сейчас я ничего не удалила"), because chat
      #     cannot express a confirmation step and Pilot was not the
      #     place to invent one. The test asserts the behaviour that
      #     ticket removed on purpose. Test-side fix.
      # (d) 1 x tests/contracts/test_event_idempotency.py — its autouse
      #     fixture sets EVENT_INGEST_TENANT_VERIFY_FAIL_OPEN but never
      #     EVENT_INGEST_ALLOWED_TENANTS / _ALLOWED_EVENTS, so
      #     booking.created is denied with
      #     `reason=relationship_unavailable` and the two reminders are
      #     never written. Every sibling suite under apps/ that
      #     dispatches envelopes does set the allowlist in its fixture
      #     (apps/eventbus/tests/test_booking_consumer.py:137 and five
      #     others). One-line fixture fix.
      #
      # The node IDs are single-quoted, unlike the apps/ deselects
      # below: parametrized IDs end in `[ModelName]`, and an unquoted
      # `[...]` is a bash glob character class. It happens to survive
      # today only because nothing matches and nullglob/failglob are
      # off — which is a property of the shell, not of this file.
      #
      # Do NOT add deselects here to silence a new failure — a new red
      # test means something you touched broke. The list is pinned to
      # specific node IDs, so renaming any of these tests must also
      # touch this file.
      # ---------------------------------------------------------------
      - name: pytest tests/ (cross-cutting suite, minus smoke)
        run: |
          uv run pytest tests/ --ignore=tests/smoke \
            --deselect 'tests/contracts/test_event_idempotency.py::TestBookingIdempotency::test_booking_created_idempotent' \
            --deselect 'tests/e2e/test_handoff_skill.py::test_handoff_flow_creates_task_silences_followup_resumes_on_resolve' \
            --deselect 'tests/e2e/test_max_echo.py::test_max_webhook_to_echo_happy_path' \
            --deselect 'tests/e2e/test_privacy_skill.py::test_delete_data_triggers_privacy_skill_and_wipes_user' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_default_manager_filters_by_current_tenant[TenantStaff]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_default_manager_filters_by_current_tenant[StaffInvite]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_default_manager_filters_by_current_tenant[DisclaimerLibrary]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_default_manager_filters_by_current_tenant[AIRequestMetric]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_default_manager_filters_by_current_tenant[BookingReminder]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_default_manager_filters_by_current_tenant[PendingBookingAction]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_default_manager_filters_by_current_tenant[RemoteBookingProxy]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_default_manager_filters_by_current_tenant[PaymentMirror]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_default_manager_filters_by_current_tenant[ScheduleException]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_default_manager_filters_by_current_tenant[LoyaltyEvent]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[TenantStaff]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[StaffInvite]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[Message]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[ConsentRecord]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[DisclaimerLibrary]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[AIRequestMetric]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[BookingReminder]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[PendingBookingAction]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[RemoteBookingProxy]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[PaymentMirror]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[ScheduleException]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_audit_mode_returns_empty_without_context[LoyaltyEvent]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_off_mode_returns_all_rows[TenantStaff]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_off_mode_returns_all_rows[StaffInvite]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_off_mode_returns_all_rows[Message]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_off_mode_returns_all_rows[ConsentRecord]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_off_mode_returns_all_rows[DisclaimerLibrary]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_off_mode_returns_all_rows[AIRequestMetric]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_off_mode_returns_all_rows[BookingReminder]' \
            --deselect 'tests/integration/test_cross_tenant_leakage.py::TestEveryScopedModel::test_off_mode_returns_all_rows[PendingBookingAction]' \
