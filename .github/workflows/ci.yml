name: ci

on:
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_bot_platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d ai_bot_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-test-secret-do-not-use-in-prod
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_bot_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ci-fake-key-not-real

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # ayla-ai-core lives in a separate private repo. CI auths via the
      # GH_DEPLOY_TOKEN secret (read-only PAT scoped to that repo). The
      # `insteadOf` rewrite makes `git+https://github.com/.../ayla-ai-core`
      # in pyproject.toml resolve to `https://x-access-token:<token>@...`
      # at fetch time without leaking the token into the lockfile.
      #
      # K12 (DRF-570) pins `ayla-ai-core==v0.6.0` exactly — `--frozen`
      # makes any drift a hard CI failure (the lockfile must match).
      - name: Configure git auth for private deps
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          if [ -n "$GH_DEPLOY_TOKEN" ]; then
            git config --global url."https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "::error::GH_DEPLOY_TOKEN secret missing — ayla-ai-core fetch will fail. Set the secret in repo settings."
            exit 1
          fi

      - name: uv sync (with ai-core extra)
        run: uv sync --extra dev --extra ai-core --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: Django manage.py check
        run: uv run python manage.py check

      - name: pytest tests/smoke/
        run: uv run pytest tests/smoke/ -v

      # mypy is blocking. `strict=False` keeps the bar reasonable while
      # apps/ are mostly empty AppConfigs; tighten to strict per-package
      # as real code lands. New untyped imports must add stubs or
      # `# type: ignore[<code>]` rather than slip through.
      - name: mypy
        run: uv run mypy apps config tests
