name: ci

on:
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "chore/**"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + ruff + mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_bot_platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d ai_bot_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-test-secret-do-not-use-in-prod
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_bot_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ci-fake-key-not-real

    steps:
      - uses: actions/checkout@v4

      # postgresql-client (pg_dump / pg_restore) needed for
      # apps/identity/tests/test_backup_restore.py — the test verifies
      # ADR-0011 §11.1 invariant (tombstoned entries stay unreadable
      # after restore). Without these binaries the test self-skips via
      # `shutil.which('pg_dump') is None`, so the gate is defence-in-
      # depth: install here so CI exercises the real backup cycle; the
      # skipif keeps local dev (Windows, minimal Docker) from breaking.
      - name: Install postgresql-client (for backup-restore test)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # ayla-ai-core lives in a separate private repo. CI auths via the
      # GH_DEPLOY_TOKEN secret (read-only PAT scoped to that repo). The
      # `insteadOf` rewrite makes `git+https://github.com/.../ayla-ai-core`
      # in pyproject.toml resolve to `https://x-access-token:<token>@...`
      # at fetch time without leaking the token into the lockfile.
      #
      # K12 (DRF-570) pins `ayla-ai-core==v0.6.0` exactly — `--frozen`
      # makes any drift a hard CI failure (the lockfile must match).
      - name: Configure git auth for private deps
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          if [ -n "$GH_DEPLOY_TOKEN" ]; then
            git config --global url."https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/".insteadOf "https://github.com/"
          else
            echo "::error::GH_DEPLOY_TOKEN secret missing — ayla-ai-core fetch will fail. Set the secret in repo settings."
            exit 1
          fi

      - name: uv sync (with ai-core extra)
        run: uv sync --extra dev --extra ai-core --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      # Red-zone direct-access guard — AST lint that blocks
      # `MemoryEntry.objects.filter(sensitivity_zone='red')` and
      # related patterns outside the sanctioned `RedZoneReader`
      # accessor. First line of defence per ADR-0011 §10 (RLS policy
      # is the final line). See `tools/lint/red_zone_guard.py`
      # docstring for what is + is not detected.
      - name: Red-zone guard (AST lint)
        run: uv run python tools/lint/red_zone_guard.py apps/

      # ADR-0009 G-series module-boundary guard — source-scoped
      # forbidden-import-edge lint (#1001, Option B). Encodes G2.1
      # (skills↛yclients), G5.1 (api↛booking mutators), G6.2
      # (eventbus consumer↛skills/channels) + the cross-repo psycopg2
      # ban (rule 2). Replaces the never-created `.importlinter`
      # baseline. See `tools/lint/import_boundaries.py` for the
      # contracts, the on-`dev` baseline, and what is NOT detected.
      - name: Import-boundary guard (AST lint)
        run: uv run python tools/lint/import_boundaries.py apps/

      # W0-X1 secret containment, mirroring the pre-commit hooks:
      #   1. filename denylist — refuses credential-bearing names even
      #      when entropy scanning would not flag them (paths only);
      #   2. detect-secrets baseline audit — fails on any secret not
      #      already recorded in the checked-in .secrets.baseline.
      - name: Sensitive filename guard
        run: uv run python tools/lint/sensitive_file_guard.py --all

      - name: detect-secrets (baseline audit)
        # detect-secrets-hook is the gating entry point: it exits
        # non-zero on any scanned secret not recorded in the baseline
        # (plain `scan --baseline` does not gate). File set mirrors the
        # pre-commit hook's `exclude` so CI and local rules stay
        # compatible. The pragma on the `run:` line marks the pinned
        # package spec, which trips the Secret Keyword heuristic (the
        # allowlist filter anchors on the YAML block's opening line).
        run: |  # pragma: allowlist secret
          git ls-files \
            | grep -vE '^(\.secrets\.baseline|uv\.lock|.*\.lock|tests/fixtures/.*|legacy_maxbot/.*|legacy_formulatela_mcp/.*|legacy_notifications/.*)$' \
            | xargs uv run --with detect-secrets==1.5.0 detect-secrets-hook --baseline .secrets.baseline

      - name: Django manage.py check
        run: uv run python manage.py check

      # Fail the build if a model change has no matching migration.
      # Prevents the kind of drift (#1030) that accumulates silently
      # because the suite doesn't otherwise exercise `makemigrations`.
      - name: Migration drift guard (makemigrations --check)
        run: uv run python manage.py makemigrations --check --dry-run

      - name: pytest tests/smoke/
        run: uv run pytest tests/smoke/ -v

      # Static Ayla client↔route-table contract (S0-C / G-Contract). Pure,
      # network-free: exercises every bot Ayla client through its real code and
      # asserts (method, path, auth header + secret, required non-auth headers)
      # matches Ayla's internal route-table. Gates every push so a client
      # method/path/auth-secret drift can't merge silently. It checks
      # client↔table consistency, NOT table↔Ayla correctness — the latter is the
      # nightly staging round-trip (#1079).
      - name: Ayla client contract (route-table)
        run: uv run pytest apps/integrations/ayla/tests/test_contract_route_table.py -v

      # mypy is blocking. `strict=False` keeps the bar reasonable while
      # apps/ are mostly empty AppConfigs; tighten to strict per-package
      # as real code lands. New untyped imports must add stubs or
      # `# type: ignore[<code>]` rather than slip through.
      - name: mypy
        run: uv run mypy apps config tests
