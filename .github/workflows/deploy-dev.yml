# deploy-dev — auto-deploy the dev MAX-bot instance on every GREEN `dev` build.
#
# Activated 2026-06 (was the DRF-891 skeleton). Runs ONLY after the `ci`
# workflow succeeds on `dev`, so a red build never deploys.
#
# ### Inert until configured
# The first step is a guard: if `DEV_HOST` is unset the whole job is a clean
# no-op (a green check, NOT a red pipeline). Nothing deploys until the
# operator lands the repo secrets + bootstraps the box.
#
# ### Operator prerequisites (one-time, DRF-891)
# Repo → Settings → Secrets and variables → Actions:
#   DEV_HOST         dev box hostname/IP (decision A: same VPS as Ayla)
#   DEV_USER         ssh user with docker rights
#   DEV_SSH_KEY      private key contents for that user (read/deploy key)
#   DEV_DEPLOY_PATH  repo checkout on the box (e.g. /home/ops/ai-bot-platform-dev)
# On the box (bootstrap once, by hand — this workflow only does *updates*):
#   - clone the repo at DEV_DEPLOY_PATH, checkout `dev`
#   - /etc/ai-bot-platform-dev/.env populated (DB / Redis / ChromaDB / MinIO
#     creds + MAX_BOT_TOKEN_DEV), scoped to dev, web on port +1000 (8013)
#   - `docker compose -p ai-bot-platform-dev up -d` once + run the catalog sync
#
# ### What each deploy does
#   1. only on a green `ci` run (workflow_run) — never deploys red builds
#   2. ssh to the box, git pull --ff-only dev
#   3. docker compose up -d --build --force-recreate --no-deps web worker
#      + сборка Mini App (DRF-1538) — статика на диске, контейнерами не едет
#      (--no-deps keeps postgres/redis/chromadb/minio + their data untouched)
#   4. smoke: /readyz/ on 8013 (5 retries) — fails the deploy if not green
#   5. best-effort Telegram alert to the dev channel

name: deploy-dev

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Deploy only a green CI run (or a manual dispatch).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Guard — no-op if deploy secrets are unset
        id: guard
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
        run: |
          if [ -z "${DEV_HOST}" ]; then
            echo "::notice::DEV_HOST not set — deploy-dev is inert (secrets + bootstrap pending DRF-891). No-op."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.guard.outputs.ready == 'true'
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_HOST: ${{ secrets.DEV_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEV_SSH_KEY}" > ~/.ssh/dev_deploy
          chmod 600 ~/.ssh/dev_deploy
          ssh-keyscan -H "${DEV_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull + rebuild + restart dev services
        if: steps.guard.outputs.ready == 'true'
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/dev_deploy "${DEV_USER}@${DEV_HOST}" bash -lc "
            set -euo pipefail
            cd '${DEV_DEPLOY_PATH}'
            git fetch origin
            git checkout dev
            git pull --ff-only origin dev
            # Откуда приезжает базовый слой (DRF-1440). Пилот достаёт
            # Docker Hub плохо — анонимный token-endpoint отвечает через
            # раз, и 31.08 две подряд выкладки умерли на нём до единой
            # скомпилированной строки. Скрипт перебирает источники от
            # зеркала в GHCR до прежнего поведения и печатает одну ссылку;
            # хуже, чем было, стать не может.
            BASE_IMAGE=\"\$(DOCKER_CMD='sudo docker' ENV_FILE=/etc/ai-bot-platform-dev/.env bash scripts/resolve-base-image.sh)\"
            # \`sudo env VAR=...\`, а не \`export\` перед \`sudo\`: sudo по
            # умолчанию сбрасывает окружение (env_reset), и compose,
            # запущенный под root, не увидел бы переменную —
            # интерполяция \${PYTHON_BASE_IMAGE:-...} молча вернулась бы к
            # Docker Hub, то есть ровно к тому, что мы убираем.
            sudo env PYTHON_BASE_IMAGE=\"\$BASE_IMAGE\" \
              docker compose --env-file /etc/ai-bot-platform-dev/.env \
              -p ai-bot-platform-dev build web worker shadow-worker
            # Migrations MUST land between build and up: the new code may
            # query columns the old schema lacks (additive MemoryEntry
            # migrations 0015-0018). run --rm web uses the freshly built
            # image, so schema and code never drift apart in production.
            sudo docker compose --env-file /etc/ai-bot-platform-dev/.env \
              -p ai-bot-platform-dev run --rm web python manage.py migrate --noinput
            sudo docker compose --env-file /etc/ai-bot-platform-dev/.env \
              -p ai-bot-platform-dev up -d --force-recreate --no-deps web worker shadow-worker
            sudo docker compose -p ai-bot-platform-dev ps
          "

      # DRF-1538 — Mini App собирается здесь, потому что это статика на диске,
      # а не контейнер. Шага выше не хватало: `compose build web worker` пересобирает
      # только Python, и 20.08 выяснилось, что `dist` на боевом собран 8 августа —
      # двенадцать дней выкладки шли зелёными, а люди видели августовский интерфейс.
      #
      # Три вещи, каждая из-за конкретной поломки:
      #
      # 1. Node 20 через nvm. Системный на боксе 16, Vite 5 его не принимает,
      #    и сборка падает до первой строки.
      # 2. Сборка идёт в `dist.new`, а не поверх `dist`. `vite build` очищает
      #    каталог назначения ПЕРЕД записью, и 21.08 монитор поймал 403 на
      #    miniapp-dev и proapp — восемь секунд, пока nginx было нечего отдавать.
      #    Здесь живой `dist` не трогается, пока новая сборка не готова целиком.
      # 3. Подмена — двумя `mv` после проверки. Провал сборки не доходит до
      #    живого каталога вовсе, а прежний остаётся в `dist.prev` для отката:
      #      mv dist dist.broken && mv dist.prev dist
      - name: Build Mini App (static, not a container)
        if: steps.guard.outputs.ready == 'true'
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/dev_deploy "${DEV_USER}@${DEV_HOST}" bash -lc "
            set -euo pipefail
            cd '${DEV_DEPLOY_PATH}/apps/miniapp'

            export NVM_DIR=\"\$HOME/.nvm\"
            # shellcheck disable=SC1091
            . \"\$NVM_DIR/nvm.sh\"
            # Хост переехал 03.09; на новой машине nvm может быть без 20-й.
            # Молча упасть на \`nvm use\` хуже, чем поставить её один раз.
            nvm use 20 || nvm install 20
            node --version

            npm ci --no-audit --no-fund

            rm -rf dist.new
            npx tsc --noEmit
            npx vite build --outDir dist.new --emptyOutDir

            # Проверяем ДО подмены: пустой или обрезанный результат не должен
            # доехать до живого каталога. Одного index.html мало — vite пишет
            # его первым, а падает на ассетах.
            test -s dist.new/index.html
            test -d dist.new/assets
            test \"\$(ls -1 dist.new/assets | wc -l)\" -gt 0

            rm -rf dist.prev
            if [ -d dist ]; then mv dist dist.prev; fi
            mv dist.new dist

            echo '::notice::miniapp dist rebuilt:' \"\$(ls -1 dist/assets | grep -cE '\.js\$')\" 'js bundles'
            stat -c '%y %n' dist/index.html
          "

      # Проверка снаружи, а не на диске: свежая дата файла обновится и при сборке
      # старого дерева. Здесь мы достаём имя бандла из отданного по https index.html
      # и убеждаемся, что сам бандл скачивается. Это доказывает, что человек
      # получает новый код, а не что файл лежит на месте.
      - name: Smoke — Mini App answers over https
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
        run: |
          ssh -i ~/.ssh/dev_deploy "${DEV_USER}@${DEV_HOST}" bash -lc "
            B=\$(curl -fsS https://miniapp-dev.gobeauty.site/ | grep -oE 'index-[A-Za-z0-9_-]+\.js' | head -1)
            if [ -z \"\$B\" ]; then
              echo '::warning::не нашёл имя бандла в отданном index.html'; exit 0
            fi
            if curl -fsS -o /dev/null \"https://miniapp-dev.gobeauty.site/assets/\$B\"; then
              echo '::notice::miniapp отдаёт бандл' \"\$B\"
            else
              echo '::warning::бандл' \"\$B\" 'не скачивается — посмотреть nginx'
            fi
          "

      - name: Smoke — /readyz/ on dev (port 8013)
        if: steps.guard.outputs.ready == 'true'
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
        run: |
          ssh -i ~/.ssh/dev_deploy "${DEV_USER}@${DEV_HOST}" bash -lc "
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:8013/readyz/ >/dev/null; then
                echo '::notice::readyz green (attempt '\$i')'; exit 0
              fi
              echo 'readyz not ready (attempt '\$i'), retrying...'; sleep 6
            done
            echo '::error::readyz red after 5 attempts — investigate dev deploy'; exit 1
          "

      - name: Telegram smoke alert (informational)
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/dev_deploy "${DEV_USER}@${DEV_HOST}" bash -lc "
            cd '${DEV_DEPLOY_PATH}'
            sudo docker compose --env-file /etc/ai-bot-platform-dev/.env \
              -p ai-bot-platform-dev exec -T web \
              python manage.py smoke_alert --severity=warning \
              --title='dev deploy' --body='${SHA}' || true
          "
