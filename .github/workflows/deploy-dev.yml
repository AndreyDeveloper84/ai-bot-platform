# deploy-dev — auto-deploy the dev MAX-bot instance on every GREEN `dev` build.
#
# Activated 2026-06 (was the DRF-891 skeleton). Runs ONLY after the `ci`
# workflow succeeds on `dev`, so a red build never deploys.
#
# ### Three outcomes, three different symbols (DRF-1605)
# `deploy-dev: success` used to mean one of two things — "the pilot was
# updated" or "there was nowhere to update", because an unset `DEV_HOST`
# produced a clean green no-op. Those are not the same event and a green check
# is not allowed to stand for both. `OPEN_DECISIONS` §78: every skip must have
# a name.
#
#   success  — it deployed. The pilot is running this commit.
#   skipped  — `ci` was red (or this was not a green `ci` run), so no job ran
#              at all. Nothing was attempted, nothing shipped.
#   failure  — it tried and could not. That now INCLUDES an unset `DEV_HOST`:
#              the job `deploy target NOT configured` names the outcome and
#              exits non-zero.
#
# All three are readable in `gh run list` from the conclusion alone, without
# opening a single log. All three already occur in this workflow's own history
# — of its last 100 runs, 53 `success`, 35 `failure`, 8 `skipped`, 4
# `cancelled` — so none of them is a symbol invented for this change.
#
# The residual, stated rather than glossed: `failure` now covers two different
# things — "the deploy broke" and "there was no deploy target". They are told
# apart by which job is red, one click into the run, not by the conclusion. That
# is a deliberate trade: the alternative was a third meaning on `cancelled`,
# which already carries two in this repository (§77), and re-using a symbol is
# exactly the defect being removed here. Both meanings do agree on the thing the
# reader needs from the list — the pilot was NOT updated by this run.
#
# ### Why "not configured" is red and not green (§79, приём 2)
# §79 says to ask first whether the skip can be avoided altogether. It can:
# the June guard ("a green check, NOT a red pipeline") was written for the
# weeks when the secrets deliberately did not exist yet (DRF-891). They exist,
# and this workflow has been deploying since 2026-06. A deploy pipeline with
# nowhere to deploy is a defect, not a resting state, so it reports as one.
#
# A literally `skipped` run is not reachable here and the reason is worth
# writing down so nobody tries again: the `secrets` context is NOT available
# in `jobs.<id>.if` (only `github`, `needs`, `vars`, `inputs`), so the presence
# of `DEV_HOST` can only be discovered from inside a job that already ran — and
# a run holding one successful job plus one skipped job concludes `success`,
# which is the exact symbol being taken away. `cancelled` was rejected too: it
# already carries two meanings in this repository (§77 — the `*-docs-skip`
# self-cancel, and a run superseded by a newer push), and a third meaning on
# the same symbol would recreate this very defect somewhere else.
#
# Switching the decision costs one line: `exit 1` -> `exit 0` in the
# `not-configured` job. The name of the skip survives either way.
#
# ### Its sibling in `deploy.yml` is deliberately NOT the same shape yet
# `deploy.yml` (prod) carries the OLD single-job form of this guard: one
# `id: guard` step, `if: steps.guard.outputs.ready == 'true'` on five deploy
# steps, and a `::notice::` reading "No-op: nothing was deployed, nothing was
# backed up". DRF-1578 / PR #1484 ported it there from this file, describing it
# as "a visible no-op, not a green check that hides doing nothing". It is in
# `dev` as of 8c276fa (merged 2026-09-08 13:05 UTC), and re-checked there after
# the merge rather than only on its branch: still one job, still `id: guard`,
# still five step-level `if`s.
#
# Half of that is delivered and half is not, and the difference is the whole
# subject of DRF-1605, so it is written down rather than smoothed over. The
# notice IS the name §78 asks for and it does appear in the run's annotations.
# But the run still concludes `success`, so in `gh run list` — and in every
# dashboard, badge and "was the deploy green?" glance that reads a conclusion
# rather than a log — a prod deploy that touched nothing is still shaped
# exactly like a prod deploy that shipped. Measured, not assumed: run
# 34225611782 is that exact shape with an unset host, and it concluded
# `success` with a single job called `deploy-dev` reported green.
#
# So the divergence between these two files is real and is a thing to CLOSE,
# not to keep — one decision in two shapes across two neighbouring files is a
# future defect. It closes by porting these three jobs into `deploy.yml`, not
# by folding this file back into one job. `deploy.yml` belongs to DRF-1578, so
# that is its own ticket and its own review, and prod additionally deserves the
# question this file did not have to ask: whether a prod deploy with no host
# configured should be red at all, or should never be reachable.
#
# The one thing kept identical on purpose is the anchor: the step that reads
# the secret is still `id: guard`, so a single grep still finds both files.
#
# ### Operator prerequisites (one-time, DRF-891)
# Repo → Settings → Secrets and variables → Actions:
#   DEV_HOST         dev box hostname/IP (decision A: same VPS as Ayla)
#   DEV_USER         ssh user with docker rights
#   DEV_SSH_KEY      private key contents for that user (read/deploy key)
#   DEV_DEPLOY_PATH  repo checkout on the box (e.g. /home/ops/ai-bot-platform-dev)
# On the box (bootstrap once, by hand — this workflow only does *updates*):
#   - clone the repo at DEV_DEPLOY_PATH, checkout `dev`
#   - .env.staging в каталоге репозитория (DB / Redis / ChromaDB / MinIO
#     creds + MAX_BOT_TOKEN_DEV), web слушает 127.0.0.1:8014
#   - `docker compose -p ayla-bot-staging up -d` once + run the catalog sync
#
# ### What each deploy does
#   1. only on a green `ci` run (workflow_run) — never deploys red builds
#   2. ssh to the box, git pull --ff-only dev
#   3. docker compose up -d --build --force-recreate --no-deps web worker
#      (--no-deps keeps postgres/redis/chromadb/minio + their data untouched)
#   4. smoke: /readyz/ on 8014 (5 retries) — fails the deploy if not green
#   5. best-effort Telegram alert to the dev channel

name: deploy-dev

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # Its own job for one reason: the answer has to be visible before anything
  # else runs, and `secrets` cannot be read from a job-level `if`. It reads the
  # deploy target and says nothing else.
  preflight:
    name: is there anywhere to deploy?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Deploy only a green CI run (or a manual dispatch). When this is false
    # every job below is gated off with it and the whole run concludes
    # `skipped` — "nothing was attempted", which is true and is its own symbol.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
    steps:
      - name: Read the deploy target
        id: guard
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
        run: |
          if [ -z "${DEV_HOST}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=deploy target not configured::DEV_HOST is empty — nothing will be deployed. The run will end red, by design (DRF-1605)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy target configured — deploying"
          fi

  # The outcome that used to hide inside a green check. It exists so that
  # "nothing was deployed" has a name of its own in the job list and a
  # conclusion of its own in `gh run list`. See the header for why it is red.
  not-configured:
    name: deploy target NOT configured — nothing was deployed
    needs: preflight
    if: needs.preflight.outputs.ready != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say what did not happen
        run: |
          echo "::error title=deploy-dev deployed nothing::DEV_HOST is not set. Nothing was deployed: no host was contacted, no image was rebuilt, no migration was run and no Mini App bundle was shipped. The pilot is still serving whatever it was serving before this run. Set DEV_HOST / DEV_USER / DEV_SSH_KEY / DEV_DEPLOY_PATH (DRF-891) — or, if this repository is deliberately not wired to a host, change this job's exit code (DRF-1605)."
          exit 1

  deploy:
    name: deploy-dev
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        env:
          DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_HOST: ${{ secrets.DEV_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${DEV_SSH_KEY}" > ~/.ssh/dev_deploy
          chmod 600 ~/.ssh/dev_deploy
          ssh-keyscan -H "${DEV_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull + rebuild + restart dev services
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/dev_deploy "${DEV_USER}@${DEV_HOST}" bash -lc "
            set -euo pipefail
            cd '${DEV_DEPLOY_PATH}'
            git fetch origin
            git checkout dev
            git pull --ff-only origin dev
            # Откуда приезжает базовый слой (DRF-1440). Пилот достаёт
            # Docker Hub плохо — анонимный token-endpoint отвечает через
            # раз, и 31.08 две подряд выкладки умерли на нём до единой
            # скомпилированной строки. Скрипт перебирает источники от
            # зеркала в GHCR до прежнего поведения и печатает одну ссылку;
            # хуже, чем было, стать не может.
            BASE_IMAGE=\"\$(DOCKER_CMD='sudo docker' ENV_FILE=.env.staging bash scripts/resolve-base-image.sh)\"
            # \`sudo env VAR=...\`, а не \`export\` перед \`sudo\`: sudo по
            # умолчанию сбрасывает окружение (env_reset), и compose,
            # запущенный под root, не увидел бы переменную —
            # интерполяция \${PYTHON_BASE_IMAGE:-...} молча вернулась бы к
            # Docker Hub, то есть ровно к тому, что мы убираем.
            sudo env PYTHON_BASE_IMAGE=\"\$BASE_IMAGE\" \
              docker compose --env-file .env.staging \
              -f docker-compose.yml -f docker-compose.staging.yml \
              -f docker-compose.staging.local.yml \
              -p ayla-bot-staging build web worker celery-worker celery-beat shadow-worker
            # Migrations MUST land between build and up: the new code may
            # query columns the old schema lacks (additive MemoryEntry
            # migrations 0015-0018). run --rm web uses the freshly built
            # image, so schema and code never drift apart in production.
            sudo docker compose --env-file .env.staging \
              -f docker-compose.yml -f docker-compose.staging.yml \
              -f docker-compose.staging.local.yml \
              -p ayla-bot-staging run --rm web python manage.py migrate --noinput
            # DRF-1610 — collectstatic. Шага не было НИКОГДА: \`git grep
            # collectstatic origin/dev -- .github\` не находил ничего, и
            # админка бота на пилоте с первого дня отдавалась без единого
            # стиля. Замер 09.09.2026: \`GET https://api-dev.gobeauty.site/
            # static/admin/css/base.css\` → 404 nginx/1.18.0, а внутри
            # \`ayla-bot-staging-web-1\` \`ls /app/staticfiles\` → No such file
            # or directory.
            #
            # Виноват был не nginx: vhost настроен верно (\`location /static/\`
            # → alias \`{DEPLOY_PATH}/staticfiles/\`), а
            # \`docker-compose.staging.yml\` монтирует \`./:/app\`, то есть
            # \`/app/staticfiles\` контейнера И ЕСТЬ \`{DEPLOY_PATH}/staticfiles\`
            # хоста. Каталога просто не существовало, потому что команду,
            # которая его создаёт, не запускал никто. Отдать статику
            # приложением тоже нечем: \`whitenoise\` в проекте отсутствует.
            #
            # Той же формой, что и \`migrate\` выше, и по той же причине:
            # \`run --rm web\` берёт СВЕЖЕСОБРАННЫЙ образ, поэтому статика на
            # диске и код в контейнерах не разъезжаются. Порядок — после
            # миграций и до \`up -d\`: файлы кладутся на смонтированный хостовый
            # каталог, работающие контейнеры для этого не нужны.
            sudo docker compose --env-file .env.staging \
              -f docker-compose.yml -f docker-compose.staging.yml \
              -f docker-compose.staging.local.yml \
              -p ayla-bot-staging run --rm web python manage.py collectstatic --noinput
            # Проверка ИСХОДА, а не кода возврата — DRF-1605 ровно про этот
            # класс дефекта. \`collectstatic --noinput\` завершается нулём и при
            # «0 static files copied»: неверный STATIC_ROOT, приложение без
            # \`static/\`, пустой поиск — всё это молча зелёный шаг и
            # по-прежнему голая админка. Молчаливо успешный шаг, ничего не
            # собравший, неотличим от работающего.
            #
            # Смотрим по ХОСТУ, а не внутри контейнера: nginx читает
            # \`{DEPLOY_PATH}/staticfiles/\` и никакого \`/app\` не знает.
            # Каталог смонтирован, так что сегодня это один и тот же диск —
            # но доказательство должно смотреть на тот путь, который отдают
            # людям, а не на его зеркало.
            if [ ! -d staticfiles ]; then
              echo '::error::collectstatic отработал, но каталога staticfiles/ на хосте нет — nginx отдаст 404 на весь /static/'
              exit 1
            fi
            if [ -z \"\$(find staticfiles -type f -print -quit)\" ]; then
              echo '::error::staticfiles/ существует, но пуст — шаг зелёный, админка голая. Смотреть STATIC_ROOT (config/settings/base.py) и состав INSTALLED_APPS'
              exit 1
            fi
            # Именной файл, а не только «непусто»: \`admin/css/base.css\` —
            # ровно тот, на котором 09.09 приехал 404. Непустым каталог могли
            # бы сделать и чужие остатки от ручной починки.
            if [ ! -s staticfiles/admin/css/base.css ]; then
              echo '::error::staticfiles/ непуст, но admin/css/base.css нет — django.contrib.admin не собрался, админка останется без стилей'
              exit 1
            fi
            echo \"::notice::collectstatic: \$(find staticfiles -type f | wc -l) файлов в staticfiles/\"
            sudo docker compose --env-file .env.staging \
              -f docker-compose.yml -f docker-compose.staging.yml \
              -f docker-compose.staging.local.yml \
              -p ayla-bot-staging up -d --force-recreate --no-deps web worker celery-worker celery-beat shadow-worker
            sudo docker compose -p ayla-bot-staging ps
          "

      # DRF-1538 — Mini App. Собирается НА РАННЕРЕ, а не на боевой машине.
      #
      # Почему это вообще нужно: `compose build` пересобирает только Python.
      # Mini App — статика на диске, и выкладка её не трогала вовсе. 20.08
      # выяснилось, что `dist` на боевом собран 8 августа: двенадцать дней
      # выкладки шли зелёными, а люди видели августовский интерфейс.
      #
      # Почему не на хосте: Node там нет — проверено 06.09, nvm под
      # пользователем выкладки отсутствует. Ставить его туда значит завести ещё
      # одну вещь, которая молча разъедется с версией из CI. На раннере
      # окружение фиксировано и совпадает с тем, в котором PR проходил проверки.
      - name: Checkout dev (для сборки Mini App)
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/miniapp/package-lock.json

      - name: Build Mini App on the runner
        working-directory: apps/miniapp
        run: |
          npm ci --no-audit --no-fund
          npm run build
          # Одного index.html мало — vite пишет его первым, а падает на ассетах.
          test -s dist/index.html
          test -d dist/assets
          test "$(ls -1 dist/assets | wc -l)" -gt 0
          echo "::notice::собрано файлов в assets: $(ls -1 dist/assets | wc -l)"

      # Везём готовое tar'ом по ssh: rsync на хосте может не быть, tar есть
      # всегда. Кладём в dist.new, проверяем, и только потом подменяем двумя mv.
      #
      # `vite build` очищает каталог назначения ПЕРЕД записью, и 21.08 монитор
      # поймал 403 на miniapp-dev и proapp — восемь секунд, пока nginx было
      # нечего отдавать. Здесь живой dist не трогается вовсе, пока новая сборка
      # не лежит на диске целиком. Прежний остаётся в dist.prev для отката:
      #   mv dist dist.broken && mv dist.prev dist
      - name: Ship Mini App to the box and swap
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
        run: |
          SSH="ssh -i $HOME/.ssh/dev_deploy ${DEV_USER}@${DEV_HOST}"
          MA="${DEV_DEPLOY_PATH}/apps/miniapp"

          $SSH "rm -rf '$MA/dist.new' && mkdir -p '$MA/dist.new'"
          tar -C apps/miniapp/dist -cf - . | $SSH "tar -C '$MA/dist.new' -xf -"
          $SSH "cd '$MA' && test -s dist.new/index.html && test -d dist.new/assets && ls -A dist.new/assets | grep -q ."
          $SSH "cd '$MA' && rm -rf dist.prev && { [ -d dist ] && mv dist dist.prev || true; } && mv dist.new dist && stat -c '%y %n' dist/index.html"

      # Проверка снаружи, а не по диску: свежая дата файла обновится и при
      # сборке старого дерева. Достаём имя бандла из отданного по https
      # index.html и скачиваем сам бандл — это доказывает, что человек получает
      # новый код. Информационный: nginx и сборка — разные отказы, путать их не
      # надо, поэтому выкладку не валит.
      - name: Smoke — Mini App answers over https
        continue-on-error: true
        run: |
          B=$(curl -fsS https://miniapp-dev.gobeauty.site/ | grep -oE 'index-[A-Za-z0-9_-]+[.]js' | head -1)
          if [ -z "$B" ]; then
            echo "::warning::не нашёл имя бандла в отданном index.html"; exit 0
          fi
          if curl -fsS -o /dev/null "https://miniapp-dev.gobeauty.site/assets/$B"; then
            echo "::notice::miniapp отдаёт бандл $B"
          else
            echo "::warning::бандл $B не скачивается — смотреть nginx"
          fi

      - name: Smoke — /readyz/ on dev (port 8014)
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
        run: |
          ssh -i ~/.ssh/dev_deploy "${DEV_USER}@${DEV_HOST}" bash -lc "
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:8014/readyz/ >/dev/null; then
                echo '::notice::readyz green (attempt '\$i')'; exit 0
              fi
              echo 'readyz not ready (attempt '\$i'), retrying...'; sleep 6
            done
            echo '::error::readyz red after 5 attempts — investigate dev deploy'; exit 1
          "

      - name: Telegram smoke alert (informational)
        continue-on-error: true
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEV_DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/dev_deploy "${DEV_USER}@${DEV_HOST}" bash -lc "
            cd '${DEV_DEPLOY_PATH}'
            sudo docker compose --env-file .env.staging \
              -f docker-compose.yml -f docker-compose.staging.yml \
              -f docker-compose.staging.local.yml \
              -p ayla-bot-staging exec -T web \
              python manage.py smoke_alert --severity=warning \
              --title='dev deploy' --body='${SHA}' || true
          "
