# deploy-dev — push to `dev` branch → deploy to dev MAX-bot instance
#
# Sprint 10 / DRF-891 — replaces the Sprint 0 placeholder.
#
# ### Trigger
# - push to `dev` branch (after PR from feat/* merges into dev)
# - manual via workflow_dispatch
#
# ### What it does (when secrets configured)
# 1. CI gate via `needs: ci` — won't deploy red builds.
# 2. SSH to DEV_HOST as DEV_USER.
# 3. git fetch + checkout dev + pull
# 4. docker compose --env-file .env.dev up -d --force-recreate web worker
# 5. Smoke: /readyz/ on the dev port (8013 not 8003)
# 6. Telegram alert to dev-team channel via `python manage.py smoke_alert
#    --severity=warning --title="dev deploy" --body="<sha>"`
#
# ### Operator setup BEFORE first real deploy
#
# All steps are commented out below — uncomment after these are done:
#
# 1. DRF-891 task 1: create @ai_bot_platform_dev MAX-bot, token in 1Password
# 2. DRF-891 task 5: deploy dev instance (decision A: same VPS port +1000)
# 3. GitHub repo secrets:
#    - DEV_HOST (e.g. app.penza.taxi if same VPS)
#    - DEV_USER (e.g. ops)
#    - DEV_SSH_KEY (private key contents — `cat ~/.ssh/id_rsa | clip`)
#    - DEV_DEPLOY_PATH (e.g. /home/ops/ai-bot-platform-dev)
# 4. dev box /etc/ai-bot-platform-dev/.env populated with MAX_BOT_TOKEN_DEV,
#    DB / Redis / ChromaDB credentials scoped to dev
#
# Until then, the workflow is a skeleton that exercises the trigger graph
# but performs no destructive ops.

name: deploy-dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Print deploy plan
        run: |
          echo "::notice::deploy-dev triggered for ${{ github.ref }} @ ${{ github.sha }}"
          echo "Triggered by ${{ github.event_name }}"

