# deploy — push to `main` branch → deploy to prod MAX-bot instance
#
# Sprint 10 / DRF-891 — sibling of deploy-dev.yml. Operator workflow:
#   feat/* → PR → dev → (manual test on dev-bot ≥1h) → PR → main → prod
#
# ### Trigger
# - push to `main` branch (after PR from `dev` merges)
# - manual via workflow_dispatch (emergency hotfix path — still requires
#   approval per branch protection rules)
#
# ### Gates BEFORE prod deploy fires
# 1. CI must be green on the merge commit (branch protection enforces)
# 2. Code must have spent ≥24h on dev-bot per canary-ramp.md pre-flight
#    (manual gate — operator confirms in PR description)
# 3. During X-track canary window: deploys are scoped to non-canary-affecting
#    code only. Any change to skill dispatch / pipeline / scope enforcement
#    requires `canary-pause` label + Lead approval.
#
# ### Setup status
# This is the **bootstrap version** of the workflow. Real machinery
# activates when DRF-891 closes:
# - DRF-891 task 2: branch protection enforced
# - DRF-891 task 4: GitHub secrets PROD_HOST / PROD_USER / PROD_SSH_KEY
# - DRF-891 task 5+ done
#
# Until then, workflow exercises trigger graph + prints what WOULD deploy.

name: deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false  # NEVER cancel a prod deploy in flight

jobs:
  deploy:
    name: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Pre-flight check — was this on dev?
        run: |
          echo "::notice::deploy-prod triggered for ${{ github.ref }} @ ${{ github.sha }}"
          echo "Triggered by ${{ github.event_name }}"
          # The dev-bot 24h soak gate is currently manual (operator confirms
          # in PR description). Sprint 11+ can automate this via a check
          # that queries dev's audit log for first-seen-on-dev timestamp.

