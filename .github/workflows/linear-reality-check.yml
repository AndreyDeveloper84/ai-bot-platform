# Сторож расхождения Linear с действительностью.
#
# ЗАЧЕМ. 04.09.2026 заведён эпик DRF-1479 «Client Surface Reconciliation»,
# Urgent. 10.09 главное окно доложило владельцу «пакет не начинался — шесть
# дней ноль движения», посмотрев на статус эпика. Было наоборот: шесть детей
# из семи закрыты, 21 SP сделан, а седьмой исполнен и не переведён — его код
# влит 05.09 (PR #1387) и 07.09 (PR #1424).
#
# Работа была сделана. Не записана. Это опаснее забытой задачи: бэклог, полный
# сделанного, выглядит горой работы, и по нему нельзя планировать. Шесть дней
# ушло на то, чтобы это заметить, и заметил это человек, а не механизм.
# Механизма не было вовсе — этот файл и есть механизм.
#
# ### Почему `Задача: DRF-NNNN` в теле PR не спасает
# Она СВЯЗЫВАЕТ, но не ЗАКРЫВАЕТ. Замер 10.09: Linear двигает задачу
# `Backlog → In Progress` при открытии PR и НЕ ТРОГАЕТ статус при слиянии.
# То есть даже полностью размеченный PR оставляет задачу открытой навсегда.
# Сторож ссылки на задачу (`ticket-reference-guard.yml`) обеспечивает адрес;
# этот сторож обеспечивает СВЕРКУ.
#
# ### Падать или докладывать — и почему это два разных вопроса
# Прогон НЕ падает от того, что нашёл расхождения. Красный по чужому бэклогу
# каждое утро перестают читать через неделю; ровно так умерла панель здоровья
# с 2018 неудачными проверками подряд, и ровно поэтому `miniapp-drift` не
# гоняется на pull_request. Непустой список — доклад, а не поломка.
#
# Прогон падает ровно в одном случае: сторож НЕ СМОГ ПОСМОТРЕТЬ. Нет ключа,
# упал запрос, пришла пустая выборка, не прошёл положительный контроль. Такой
# красный редок, действие по нему одно и однозначно, а его отсутствие — то
# самое ложное спокойствие, из-за которого `grep -c` на упавшей команде
# читается как «искали и не нашли».
#
# ### Что он НЕ делает
# Не меняет статусы в Linear: только читает и докладывает. Автоматическое
# закрытие задач — отдельное решение владельца, которого нет. Ни одной
# GraphQL-мутации в коде нет, и это проверяется самотестом при каждом прогоне.

name: linear-reality-check

# ### Какой из триггеров действительно сработает
#
# `schedule` и `workflow_dispatch` читаются ТОЛЬКО с ветки по умолчанию.
# Здесь она `dev` (проверено `gh repo view --json defaultBranchRef` 10.09.2026;
# комментарий в `miniapp-drift.yml` про `main` устарел), поэтому оба начнут
# работать сразу, как этот файл вольётся в `dev`. До слияния — не начнут, и
# молчание Actions до слияния не значит «расхождений нет».
#
# `pull_request` ограничен собственными файлами сторожа и запускает ТОЛЬКО
# самотест: живая половина требует секрета, а секреты недоступны PR из форка.
# Красный, который автор PR не может починить, — это тот же игнорируемый
# красный, только адресованный не тому человеку.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Порог застоя в днях (вопросы 2 и 4)"
        required: false
        default: "5"
  pull_request:
    paths:
      - ".github/linear-reality-check/**"
      - ".github/workflows/linear-reality-check.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: linear-reality-check
  cancel-in-progress: false

jobs:
  reality-check:
    name: Linear против действительности
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ПРОВЕРКА ПОДМЕНОЙ ИДЁТ ПЕРВОЙ И ИДЁТ ВСЕГДА.
      #
      # Она возвращает DRF-1479 и DRF-1481 в тот статус, в котором они были
      # 10.09 в 07:52 — за минуту до ручного исправления, — и требует, чтобы
      # сторож их нашёл. Вторая её половина требует, чтобы на снимке, где те
      # же задачи переведены в Done, сторож о них замолчал: правило, которое
      # срабатывает всегда, — не правило, а совпадение.
      #
      # Она стоит В ПРОГОНЕ, а не в чьей-то голове и не в отдельном CI:
      # доказательство, что детектор работает, должно предъявляться тем же
      # прогоном, который печатает числа. Сеть и ключ ей не нужны.
      - name: Проверка сторожа подменой (сеть не нужна)
        run: python .github/linear-reality-check/selftest.py

      # Секрет проверяется отдельным шагом, чтобы «ключа нет» не выглядело в
      # логе как «Linear ответил пусто». У разных болезней разные имена.
      - name: Ключ Linear на месте?
        if: github.event_name != 'pull_request'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${LINEAR_API_KEY:-}" ]; then
            echo "::error::Секрета LINEAR_API_KEY в репозитории нет — сторож установлен, но слеп."
            {
              echo "# Сторож расхождения Linear с действительностью"
              echo
              echo "**Прогон КРАСНЫЙ: сторож не смог посмотреть.**"
              echo
              echo "Секрета \`LINEAR_API_KEY\` в репозитории нет. Проверка подменой выше"
              echo "прошла — значит, детектор рабочий; смотреть ему нечем."
              echo
              echo "Заводит секрет владелец репозитория:"
              echo "Settings → Secrets and variables → Actions → New repository secret,"
              echo "имя \`LINEAR_API_KEY\`, значение — персональный ключ Linear (\`lin_api_...\`)."
              echo
              echo "Этот красный намеренно не сделан зелёным: зелёный слепой сторож —"
              echo "это ложное спокойствие, ровно то, против чего он заведён."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::notice::Ключ Linear получен из секрета репозитория (значение не печатается)."

      - name: Сверить Linear с действительностью
        if: github.event_name != 'pull_request'
        env:
          # Ключ приходит секретом репозитория и нигде не печатается — ни в
          # логе, ни в отчёте, ни в артефакте. В коде его нет и быть не может.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # `gh api graphql` внутри скрипта ходит этим токеном.
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ github.event.inputs.days || '5' }}
        run: |
          set -euo pipefail
          python .github/linear-reality-check/reality_check.py \
            --days "$DAYS" \
            --out-md  reality-check/report.md \
            --out-json reality-check/report.json \
            --dump-snapshot reality-check/snapshot

      # Отчёт кладётся в сводку прогона ВСЕГДА, в том числе когда предыдущий
      # шаг упал: сводка сломанного прогона — это и есть объяснение, почему
      # числам нельзя верить. Пустая сводка объяснила бы ровно ничего.
      - name: Положить отчёт в сводку прогона
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ -f reality-check/report.md ]; then
            cat reality-check/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Артефакт переживает сессию и содержит ПОЛНЫЕ списки: в сводке они
      # обрезаны сорока строками на вопрос, а планировать по обрезанному
      # списку — это снова планировать по неполной картине.
      - name: Сохранить отчёт и снимок обеих сторон
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: linear-reality-check
          path: reality-check/
          retention-days: 90
          if-no-files-found: warn
