# DRF-1656 — у отмены решения должен быть след в коде.
#
# Почему СВОЙ workflow, а не шаг в ci.yml.
#
#   Предмет этого сторожа — `docs/OPEN_DECISIONS.md`. На docs-only PR
#   инженерные job'ы `ci.yml` пропускаются гейтом `changes` (DRF-1675;
#   до 12.09 вместо них отчитывался близнец `ci-docs-skip.yml`), то есть
#   ничего не проверяют по построению (§77 реестра — механизм, не ловушка).
#   То есть шаг внутри `ci.yml` был бы слеп ровно к тому PR, который
#   меняет его предмет. Шаг в `ci.yml` всё равно добавлен — он ловит
#   вторую половину правила, «путь исчез из репозитория», которую
#   ломает как раз PR с кодом и без документации.
#
#   Фильтров `paths:` здесь нет намеренно. Фильтр отключает прогон, а
#   отключённый прогон «не отчитывается никогда» — та же ловушка
#   обязательной проверки, которую в `ci.yml` закрывает гейт `changes`.
#   Сторож читает один файл стандартной библиотекой и стоит секунды,
#   так что дешевле запускать его всегда, чем объяснять потом, почему
#   он молчал.
name: open-decisions

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-reversal:
    name: decision-reversal guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Стандартная библиотека, без зависимостей — поэтому ни uv, ни
      # установки окружения.
      #
      # Прогон ВСЕГДА печатает, сколько секций с отменой он нашёл, и
      # падает, если ноль: «ничего не нарушено» и «ничего не осмотрено»
      # выглядят одинаково, и различает их только счётчик.
      - name: Decision-reversal guard (docs/OPEN_DECISIONS.md)
        run: python tools/lint/decision_reversal_guard.py
