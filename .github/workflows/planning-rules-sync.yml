name: planning-rules-sync

# Дрейф-контроль артефакта реестра планировочных правил (D-1): вендоренная
# копия в apps/planning_rules/data/ обязана совпадать с источником в
# ayla-knowledge. Правило, изменённое владельцем, не должно тихо не доехать.
# Отдельный workflow, а не шаг ci: дрейф источника — не поломка чужого PR.

on:
  pull_request:
    paths:
      - "apps/planning_rules/**"
      - "scripts/sync_planning_rules_registry.py"
      - ".github/workflows/planning-rules-sync.yml"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install "PyYAML==6.0.2"

      - name: Check registry drift against ayla-knowledge
        # ayla-knowledge закрыт с 06.11.2026 (DRF-1703); анонимно raw отдаёт
        # 404, и сверка падала каждую ночь с 07.11. Токен — тот же секрет,
        # которым ставится ayla-ai-core; ему нужно чтение содержимого
        # ayla-knowledge. Скрипт значение не печатает.
        env:
          PLANNING_RULES_SOURCE_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: python scripts/sync_planning_rules_registry.py --check
