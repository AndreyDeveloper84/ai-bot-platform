# Replay regression gate (Sprint 5 / E1+E2 — DRF-521 + DRF-522).
#
# Runs golden + adversarial + voice YAML fixtures through apps.replay
# on every PR. Blocks merges that break the fixture set.
#
# ### What this gate enforces
#
# 1. Every adversarial / voice fixture runs through the code that ACTUALLY
#    answers people — `channels.max.handler._handle_global_max_event_inner`
#    — and the deterministic replies are held to the fixture in full.
#    See apps/replay/tests/test_live_path_gate.py.
# 1b. Every GOLDEN fixture runs through the per-tenant sibling that answers
#    a salon's clients — `channels.max.handler.handle_max_event` — with the
#    same deterministic / needs-the-outside-world split. See
#    apps/replay/tests/test_golden_gate.py.
#
#    This step is new, and the name of this job was a lie until it landed.
#    «golden + adversarial + voice» has been the title since Sprint 5 while
#    the golden third was only ever parsed: eighty fixtures, checked for
#    valid YAML, for numbering eighty, and for carrying at least one rule.
#    Nothing ran one. Executed for the first time, 39 of the 80 did not
#    pass — a set that had looked like coverage for four sprints and was
#    not. The live-path gate excluded golden with a correct reason (the
#    GLOBAL handler dispatches no skills, so golden scenarios would assert
#    against a system that is not the one under test) and an incorrect
#    conclusion — that golden therefore could not be gated at all. It has
#    its own handler, one door over.
# 2. A red-flag input never reaches a language model, proved with a canary
#    stub that emits the fixture's own forbidden phrases.
# 3. All fixtures parse and pass the echo baseline.
# 4. The replay engine (recorder, redactor, assertions, differ, runner,
#    CLI) is green under unit + integration test.
#
# ### What this gate does NOT enforce
#
# Whether the MODEL's words are good. CI has no model: calling one would
# make the gate non-deterministic and paid, and mocking one turns an
# adversarial assertion into a check of the mock. Fixtures whose reply
# needs the model are reported BY NAME on every run («N/M need a live
# model») and are not counted as covered. Judging those is a live run,
# which `python -m apps.replay run` exists for.
#
# The earlier note here said this workflow would upgrade to the real
# pipeline «when Sprint 6 lands pipeline.turn». It landed, the upgrade did
# not, and pipeline.turn turned out to have no production callers at all —
# so the upgrade went to the live global path instead.
#
# ### Override mechanism (E2)
#
# A PR labeled `prompt-regression-accepted` skips the gate. This is an
# explicit, audited bypass for intentional prompt/skill changes that
# alter the fixture-validated behavior. Label-only humans-with-write-
# access can apply (GitHub default). The label name is the audit trail.
#
# ### Failure budget
#
# Strict. Any fixture failure → red. There is no soft-fail mode.
# If you need to ship a behavioral change, update the fixtures in the
# same PR. The fixture diff IS the design review for AI changes.
#
# ### Every refusal of this gate must be RED (DRF-1373)
#
# For fourteen consecutive runs this gate did not run to completion, and
# nobody noticed, because both ways it stopped are GREY in the UI:
#
# 1. `timeout-minutes` — GitHub records an exceeded job timeout with
#    conclusion `cancelled`, which renders identically to «somebody
#    skipped this deliberately».
# 2. `cancel-in-progress` on a `github.ref` group — nine PRs merged in a
#    day, and each merge to `dev` cancelled the gate run of the previous
#    merge. The gate that is supposed to check what LANDED effectively
#    ran for the last merge of each burst only.
#
# A guard whose refusal is invisible is worse than no guard: it
# manufactures calm. So:
#
# * every test step carries its OWN budget, enforced by `timeout(1)`
#   INSIDE the step. An exceeded budget is a failed step, which is a
#   failed job, which is RED, and it says in an ::error annotation which
#   budget was blown and by which command.
# * `timeout-minutes` on the job stays at ten and did NOT have to move.
#   The budgets sum to 540s (360s before the golden gate joined), so one
#   of them always expires first. It is now a backstop against a wedged
#   runner — the thing a job-level timeout is actually good for — and no
#   longer the mechanism that reports a slow test suite.
# * the concurrency group is keyed on the PR number, not the ref, and
#   `cancel-in-progress` is restricted to pull requests. Superseding a
#   PR commit is a legitimate grey; cancelling the gate for a commit
#   that is already on `dev` is a hole.
#
# ### CI has no model, and now the RUNNER says so (DRF-1373)
#
# The scope note above promises the gate never calls a language model.
# That promise was held by an accident: `resolve_intent` called
# `llm_client.create(...)`, a method the router client does not have, so
# every resolution raised `AttributeError` into its own `except` and
# fell back deterministically. DRF-1310 (a18ca02) fixed the typo to
# `llm_client.chat.completions.create(...)` — correct in production, and
# it turned every fixture turn in this gate into a real TLS round trip
# to api.openai.com, rejected 401 because the key here is fake. Measured
# on the runner: the gate step went 16s → 287s and hit the ceiling.
#
# The fixture mocks `generate_concierge_reply` but not the resolver, so
# the promise depended on one test file remembering every LLM entry
# point on the live path. It cannot: new entry points arrive with
# features, and the failure mode is silent (a 401 looks like a fallback).
# The env block below therefore gives the JOB no route to any model —
# `OPENAI_PROXY` points at a dead local port and the request budget is a
# quarter-second — so a forgotten mock costs a fast deterministic
# fallback instead of an outbound request. A test may still mock; it no
# longer has to be the only thing standing between CI and a paid,
# non-deterministic, third-party call.

name: replay

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Keyed on the PR, not the ref (DRF-1373). A new commit on a PR makes the
# previous run's verdict meaningless, so cancelling it is honest. A push to
# `dev` is a DIFFERENT commit that is already merged — cancelling its gate
# run leaves landed code ungated, which is exactly how nine PRs went in
# without a replay verdict. `github.sha` gives every push its own group, so
# a burst of merges queues instead of cancelling.
concurrency:
  group: replay-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    name: replay fixtures (golden + adversarial + voice)
    runs-on: ubuntu-latest
    # 10 → 15, together with the budgets and with the measurement DRF-1373
    # asked for.
    #
    # DRF-1373 left this at 10 for a good reason: the ceiling was the
    # symptom, never the defect, and raising it then would have bought a few
    # weeks of quiet before failing again, larger. That reason still holds
    # and this is not that move. The golden gate adds a fourth 180s budget;
    # the budgets now sum to 540s and setup (checkout + cached uv sync)
    # costs ~90s, so a ten-minute ceiling could fire BEFORE the inner budget
    # — which is the grey `cancelled` conclusion DRF-1373 removed,
    # reintroduced by arithmetic. 15 restores the invariant: a budget always
    # expires first, and a budget expiring is RED.
    #
    # Measurement. On THIS runner, 167 golden tests through the real
    # handler: 13.9s (run 33318534343). Locally the same suite took 61-72s
    # over three runs on a loaded Windows box with Postgres in Docker — the
    # number that sized the budget before CI had ever run it, and it was
    # five times pessimistic. Recorded because the next person to touch this
    # budget deserves to know which of the two figures is the real one.
    #
    # Budget stays 180s: proportionally the same headroom the live-path gate
    # carries over its measured 22s, and a budget is a tripwire for a
    # regression, not a target. Tighten it only with a reason to believe the
    # corpus has stopped growing.
    #
    # Still a backstop against a wedged runner, still not the mechanism that
    # reports a slow suite. Raise it only together with the budgets, and
    # only with a measurement in the PR.
    timeout-minutes: 15

    # E2 — `prompt-regression-accepted` label skips the gate.
    # Pushes (not PRs) always run; the label only fires on pull_request.
    if: >-
      github.event_name != 'pull_request' ||
      !contains(github.event.pull_request.labels.*.name, 'prompt-regression-accepted')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_bot_platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform  # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d ai_bot_platform"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # ### Why the `# pragma: allowlist secret` markers below
    #
    # `detect-secrets` flags three lines in this file: the throwaway password
    # of the Postgres service container defined twenty lines up, and two
    # values that say what they are in their own text —
    # `ci-test-secret-do-not-use-in-prod` and `ci-fake-key-not-real`. None is
    # a credential; all three predate the golden gate and are unchanged by it.
    #
    # They used to be covered by `.secrets.baseline`, which pins findings by
    # LINE NUMBER. That made the secret guard fail every time this file grew a
    # comment: the golden-gate work added a header block, the three lines slid
    # down seven rows, the baseline stopped matching, and CI went red on a
    # diff that touched none of them. Re-pinning the numbers fixes it until
    # the next rebase and no longer.
    #
    # An inline marker is pinned to the line's CONTENT, so it survives any
    # shift. It is also the smaller change: re-pinning meant editing
    # `.secrets.baseline`, and rebuilding that file — the obvious way to do it
    # — takes the repo from 12 recorded findings to 23, including a
    # self-referential block for `.secrets.baseline` itself. Measured, not
    # assumed. The precedent is already in the tree (`apps/booking/tests/*`).
    #
    # A marker is a claim that a specific string is not a secret. Do not add
    # one to a line whose value you have not read.
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: ci-test-secret-do-not-use-in-prod  # pragma: allowlist secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_bot_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform  # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379/0
      OPENAI_API_KEY: ci-fake-key-not-real  # pragma: allowlist secret
      # DRF-1373 — «CI has no model» enforced by the runner, not by a mock.
      # See the header block. A dead local port means an LLM call that a test
      # forgot to stub fails immediately and deterministically instead of
      # reaching a vendor; the quarter-second budget and the single attempt
      # mean it cannot be slow even if a route ever appears.
      OPENAI_PROXY: http://127.0.0.1:1
      LLM_REQUEST_TIMEOUT_S: "0.25"
      LLM_RETRY_MAX_ATTEMPTS: "1"
      LLM_RETRY_BASE_DELAY_S: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.12"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      # ayla-ai-core is in a separate repo; even though apps/replay/ does
      # not import it, `uv sync --frozen` validates the entire lockfile
      # and tries to fetch all git+ dependencies.
      #
      # That repo is PUBLIC (owner's decision 04.09.2026, recorded in
      # OPEN_DECISIONS.md §22 in the workspace root, outside this repo),
      # so the token is optional: present -> authenticated fetch, absent
      # -> anonymous fetch. The block mirrors
      # ci.yml, including the rule that a missing token must NOT fail the
      # run — see the long comment there for why (DRF-1466).
      - name: Configure git auth for the ayla-ai-core dep (token optional)
        env:
          GH_DEPLOY_TOKEN: ${{ secrets.GH_DEPLOY_TOKEN }}
        run: |
          if [ -n "$GH_DEPLOY_TOKEN" ]; then
            git config --global url."https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "GH_DEPLOY_TOKEN present — ayla-ai-core will be fetched with auth."
          else
            echo "::notice::GH_DEPLOY_TOKEN not set — fetching ayla-ai-core anonymously (the repo is public, DRF-1466). Expected on Dependabot runs."
          fi

      - name: uv sync
        run: uv sync --extra dev --extra ai-core --frozen

      # DRF-1373 — a per-step budget that fails RED. `timeout-minutes` on the
      # job cannot do this: GitHub records an exceeded job timeout as
      # `cancelled`, grey and indistinguishable from a deliberate skip, which
      # is how this gate went fourteen runs without anyone noticing it had
      # stopped running. `timeout(1)` exits 124 (or 137 after SIGKILL), the
      # step fails, the job is red, and the annotation names the budget.
      - name: Install the step-budget wrapper
        run: |
          cat > "${RUNNER_TEMP}/budget" <<'SH'
          #!/usr/bin/env bash
          # usage: budget <seconds> <label> <command...>
          seconds="$1"; shift
          label="$1"; shift
          set +e
          timeout --signal=TERM --kill-after=30s "${seconds}" "$@"
          rc=$?
          set -e
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error title=replay: ${label} exceeded its ${seconds}s budget::The step was killed at ${seconds}s, it did not pass and it did not fail on its own. Either something on the replay path got slower (profile it — DRF-1373 was one outbound HTTP call per fixture turn) or the budget needs raising WITH a measurement in the PR."
            exit 1
          fi
          exit "$rc"
          SH
          chmod +x "${RUNNER_TEMP}/budget"

      # `test_fixtures.py`, `test_live_path_gate.py` and `test_golden_gate.py`
      # are excluded here because the steps below run them by name
      # (DRF-1373). Before, both files ran twice per job — the live-path gate
      # is the most expensive thing in this workflow and it was paid for
      # twice, for nothing.
      #
      # Every budget below is MEASURED, on run 32791956392 (this branch,
      # green, 70s end to end): engine 14s, fixture sanity 1s, live-path
      # gate 23s. Each budget is that number with room for runner variance
      # and for the corpus to keep growing — a budget is a tripwire for a
      # regression, not a target. They sum to 540s with the golden gate
      # included, which is why the job ceiling moved from 10 to 15: the
      # inner budget must fire first, and it fires RED.
      - name: apps.replay unit + integration tests (strict)
        run: |
          "${RUNNER_TEMP}/budget" 120 "engine tests" \
            uv run pytest apps/replay/ \
              --ignore=apps/replay/tests/test_fixtures.py \
              --ignore=apps/replay/tests/test_live_path_gate.py \
              --ignore=apps/replay/tests/test_golden_gate.py \
              -v --tb=short

      - name: Fixture set sanity (fixtures parse + baseline-clean)
        run: |
          "${RUNNER_TEMP}/budget" 60 "fixture sanity" \
            uv run pytest apps/replay/tests/test_fixtures.py -v --tb=short

      # The gate proper: fixtures through the live answering path. Prints
      # the covered/needs-a-model split on every run so a green check can
      # never be mistaken for "all fixtures verified".
      - name: Live-path gate (fixtures through the code that answers people)
        run: |
          "${RUNNER_TEMP}/budget" 180 "live-path gate" \
            uv run pytest apps/replay/tests/test_live_path_gate.py \
              -v --tb=short --durations=15

      # The golden set, through the handler that answers a salon's clients.
      # Prints the same covered / needs-the-outside-world split, and also
      # the preconditions it grants before the turn: a gate that quietly
      # hands the system a consent record reads exactly like one that found
      # the consent already there.
      - name: Golden gate (per-tenant fixtures through the client handler)
        run: |
          "${RUNNER_TEMP}/budget" 180 "golden gate" \
            uv run pytest apps/replay/tests/test_golden_gate.py \
              -v --tb=short --durations=15

  # E2 visibility — when the override label is present we still post a
  # status check confirming the bypass is intentional.
  bypassed:
    name: replay (bypassed via prompt-regression-accepted)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'prompt-regression-accepted')
    steps:
      - name: Print bypass notice
        run: |
          echo "::warning::Replay gate skipped — 'prompt-regression-accepted' label present."
          echo "Reviewer is responsible for ensuring fixtures are updated in this PR."
          echo "PR: ${{ github.event.pull_request.html_url }}"
