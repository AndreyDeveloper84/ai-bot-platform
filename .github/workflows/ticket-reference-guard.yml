# Сторож ссылки на задачу.
#
# ЗАЧЕМ. 09.09.2026 аудит нашёл, что 68 открытых задач из 217 уже сделаны:
# треть бэклога описывала состояние, которого давно нет. Главное окно раздавало
# исполнителям предметы, закрытые днями раньше — одному окну шесть раз подряд.
#
# Причина оказалась не в дисциплине. Замер: у задачи, закрытой вручную,
# `attachments: []` и ровно один переход состояния, сделанный человеком.
# Интеграции Linear ↔ GitHub НЕ СУЩЕСТВУЕТ — список интеграций пуст. Linear
# никогда не знал о наших PR и не мог двигать статусы сам.
#
# Интеграцию подключает владелец аккаунта. Но подключённой интеграции нечего
# связывать, если в PR нет номера задачи — а у нас его нет примерно в половине.
# Этот сторож — положительная стража на номер: без неё интеграция будет
# работать «в основном», и через месяц мы вернёмся к тому же аудиту.
#
# ГДЕ ИЩЕТ. Заголовок PR и тело PR. Имя ветки НЕ считается, и это не строгость
# ради строгости — это замер.
#
# Из ста веток с номером задачи только ТРИ пишут его канонически, через дефис:
# у нас принято `fix/drf1477-timezone`, а Linear ищет `DRF-1477`. Засчитывать
# `drf1477` было бы удобно и бесполезно: сторож зеленел бы, а интеграция всё
# равно не связала бы PR с задачей — и мы вернулись бы к ручным статусам,
# но уже с ложным чувством, что механизм работает.
#
# Поэтому требуется КАНОНИЧЕСКАЯ форма `DRF-<цифры>` в заголовке или в теле —
# ровно та, которую читает интеграция. Имена веток менять не нужно.
#
# У ПРОПУСКА ЕСТЬ ИМЯ. PR без задачи законен — спасение документов, разовая
# уборка, правка самого сторожа. Но пропуск должен быть НАЗВАН, а не молчалив:
# строка `NO-TICKET: <причина>` в теле PR. Тогда в истории видно не только что
# задачи не было, но и почему её не завели. Пустой `NO-TICKET:` не считается.
#
# ЧЕГО ЭТОТ СТОРОЖ НЕ ДЕЛАЕТ. Он не проверяет, что задача существует, что она
# открыта и что она про этот предмет. Это работа интеграции и человека.
# Он проверяет ровно одно: у изменения есть адрес в трекере.

name: ticket reference

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  ticket-reference:
    name: ticket reference (DRF-NNN or named NO-TICKET)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # Автоматический автор — названное исключение, а не молчаливое.
      #
      # Замер перед включением сторожа обязательным: из шестнадцати открытых PR
      # упали бы семь, и ПЯТЬ из них — Dependabot. У него задачи не будет
      # никогда, и `NO-TICKET:` в тело ему дописать некому. Обязательная
      # проверка заблокировала бы обновления зависимостей навсегда — включая
      # обновления безопасности.
      #
      # Исключение стоит здесь, а не в условии job'а, чтобы проверка всё равно
      # ЗАПУСКАЛАСЬ и доложила успех: пропущенная проверка и пройденная
      # выглядят в списке одинаково, а означают разное (§77).
      - name: Skip for automated authors
        id: author
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          case "$PR_AUTHOR" in
            dependabot\[bot\]|renovate\[bot\]|github-actions\[bot\])
              echo "::notice::Автоматический автор ${PR_AUTHOR} — ссылка на задачу не требуется."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Сторож называет, КАКОЙ ВЕРСИЕЙ он судит.
      #
      # На `pull_request` workflow берётся из ГОЛОВЫ PR, а не из `dev`. PR,
      # открытый до починки сторожа и не перебазированный, несёт старую копию —
      # и краснеет при верном теле. Перезапуск не помогает: он перечитывает то
      # же тело тем же старым сторожем. 11.09.2026 так упал #1550: тело
      # `**Задача: DRF-1349**` проходило под регуляркой на `dev` и не проходило
      # под регуляркой в голове PR. Читатель лога принял правило головы за
      # правило репозитория — потому что лог ничем их не различал.
      #
      # Поэтому сторож печатает блоб своей копии против блоба на `dev`. Не
      # совет «проверь, не старая ли копия», а строка, по которой это видно.
      # Через contents API, без checkout: сравниваются блобы, то есть
      # СОДЕРЖИМОЕ файла, и `contents: read` для этого достаточно.
      #
      # Шаг информационный и НЕ падает сам: его предмет — назвать версию, а не
      # судить. Не смог сравнить — говорит об этом отдельной строкой, иначе
      # молчание читалось бы как «совпадает».
      - name: Name the guard's own version
        if: steps.author.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          WF_PATH: .github/workflows/ticket-reference-guard.yml
        run: |
          set -uo pipefail
          blob_at() {
            gh api "repos/${REPO}/contents/${WF_PATH}?ref=$1" --jq .sha 2>/dev/null || true
          }
          head_blob="$(blob_at "$HEAD_SHA")"
          base_blob="$(blob_at "$BASE_REF")"
          if [ -z "$head_blob" ] || [ -z "$base_blob" ]; then
            echo "::warning::Не удалось сравнить версию сторожа с ${BASE_REF} (head=${head_blob:-?} base=${base_blob:-?}). Судит копия из головы PR; какая — неизвестно."
            exit 0
          fi
          if [ "$head_blob" = "$base_blob" ]; then
            echo "::notice::Сторож судит копией, совпадающей с ${BASE_REF} (blob ${head_blob:0:12})."
          else
            echo "::warning::Сторож судит копией из ГОЛОВЫ PR (blob ${head_blob:0:12}), а на ${BASE_REF} другая (blob ${base_blob:0:12}). Красный при верном теле — сначала перебазируйте: перезапуск перечитает то же тело тем же сторожем."
          fi

      - name: Check for a ticket reference
        if: steps.author.outputs.skip == 'false'
        env:
          # Через env, а не через подстановку в скрипт: заголовок и тело PR
          # пишет человек, и обратные кавычки, кавычки и `$(...)` в них
          # исполнились бы в оболочке. Тот же класс, что кириллица в именах
          # файлов — чужой текст не должен становиться кодом.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          HAYSTACK="$PR_TITLE
          $PR_BODY"

          # НУЖНА СВЯЗЫВАЮЩАЯ ФОРМА, А НЕ УПОМИНАНИЕ. Первая версия принимала
          # любое вхождение `DRF-NNN` — и это оказалось опаснее падения.
          #
          # Живой случай, найденный исполнителем до включения: PR про бэкап
          # ПИЛОТА ссылался на `DRF-1578` как на ОБРАЗЕЦ («на боевой тропе этот
          # шаг есть с DRF-1578»). Сторож увидел бы шаблон и пропустил, а
          # интеграция привязала бы пилотный PR к боевой задаче и сдвинула её.
          # Ложное прохождение здесь двигает ЧУЖУЮ задачу, и заметит это только
          # её владелец.
          #
          # Регулярка намерения не различает — и не должна пытаться. Различает
          # МЕСТО: связывающая ссылка стоит в отведённой строке, всё остальное
          # в тексте остаётся контекстом.
          #
          # Принимаются строки, начинающиеся с:
          #   Задача: DRF-1234        (наша форма)
          #   Closes DRF-1234         формы, которые понимает и сам GitHub,
          #   Fixes DRF-1234          и на которые реагирует интеграция
          #   Resolves DRF-1234
          #
          # Разметка вокруг ключевого слова разрешена намеренно. Markdown-выделение
          # — нормальный способ письма, а не ошибка автора: в этом репозитории
          # жирным выделяют почти всё. Прежняя регулярка требовала пробел или
          # начало строки НЕПОСРЕДСТВЕННО перед словом, поэтому `**Задача: DRF-1234**`
          # не проходило, а `Задача: DRF-1234` проходило. Проверка отвечала на
          # вопрос «есть ли шаблон в голом тексте», а читалась как «указана ли
          # задача» — тот же класс, что кириллица в ci(docs-skip).
          #
          # Требование МЕСТА при этом сохраняется: ведущие `*_`#>-` допускаются
          # только сразу после начала строки или пробела, поэтому упоминание
          # чужой задачи как образца по-прежнему не проходит — у него нет
          # ключевого слова в связывающей позиции.
          if printf '%s' "$HAYSTACK" | grep -qiE '(^|[[:space:]])[*_`#>-]*(Задача:|Closes|Fixes|Resolves)[*_`]*[[:space:]]+[*_`]*DRF-[0-9]+'; then
            FOUND="$(printf '%s' "$HAYSTACK" | grep -oiE '(Задача:|Closes|Fixes|Resolves)[*_`]*[[:space:]]+[*_`]*DRF-[0-9]+' | sort -u | tr '\n' ' ')"
            echo "::notice::Ссылка на задачу найдена: ${FOUND}"
            exit 0
          fi

          # Пропуск с названной причиной. Требуем непустой текст после двоеточия:
          # `NO-TICKET:` без причины — это то же молчание, только длиннее.
          if printf '%s' "$PR_BODY" | grep -qE '^[[:space:]]*NO-TICKET:[[:space:]]*[^[:space:]]'; then
            REASON="$(printf '%s' "$PR_BODY" | grep -m1 -E '^[[:space:]]*NO-TICKET:' | sed 's/^[[:space:]]*NO-TICKET:[[:space:]]*//')"
            echo "::notice::PR без задачи, причина названа: ${REASON}"
            exit 0
          fi

          echo "::error::В этом PR нет ссылки на задачу."
          echo ""
          echo "Добавьте номер вида DRF-1234 в заголовок, в тело PR или в имя ветки."
          echo "Он нужен не для порядка: без него интеграция Linear не свяжет PR"
          echo "с задачей и статус придётся двигать памятью — так треть бэклога"
          echo "и разошлась с действительностью."
          echo ""
          echo "Если задачи действительно нет — назовите причину строкой в теле PR:"
          echo ""
          echo "    NO-TICKET: спасение документов, задачи не заводили"
          echo ""
          echo "Пустой NO-TICKET: не принимается."
          exit 1
