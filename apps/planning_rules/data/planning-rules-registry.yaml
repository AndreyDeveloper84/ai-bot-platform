      canonical_service как курс и не приводится как такое основание.
      Шаблон — предложение; значение действует только после подтверждения
      человеком. Runtime-носитель — каталог wellness.PlanTemplate
      (beautygo_backend wellness/plan_lite_templates.py, сид = эта таблица).
