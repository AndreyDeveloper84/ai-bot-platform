# Ayla Planning Rules Registry — machine-readable носитель планировочных правил
#
# Canonical source: ayla-knowledge / 03 AI System/Contracts/planning-rules-registry.yaml
# Нормативный источник семантики: PLANNING_CONSTRAINTS_CONTRACT_v1.1.md
# (v1.0 — история; v1.1 добавляет PLAN_CADENCE по AYLA-DEC-0093, 2026-09-21)
# (docs/specs/, рабочее дерево Ayla), решение владельца D-1 от 08.09.2026
# (docs/OPEN_DECISIONS.md §70).
# Change control: изменение этого файла — через change control ayla-knowledge;
#   additive-изменение = minor, изменение семантики = major.
# registry_version версионирует ЭТОТ реестр; runtime отвергает неизвестную
# major ДО разбора тела (образец: ai-bot-platform
# apps/integrations/ayla/recommendation_resolver_client.py, SUPPORTED_SPEC_MAJOR).
registry: ayla.planning-rules-registry
registry_version: "1.0"
compatible_contract_version: "1.1"   # PLANNING_CONSTRAINTS_CONTRACT_v1.1
status: draft
updated: 2026-09-21

# Закрытый перечень типов (контракт §3). Перечень расширен ВЛАДЕЛЬЦЕМ до 14
# (PLAN_CADENCE, AYLA-DEC-0093, 2026-09-21); пятнадцатый тип не заводится —
# рантайм не расширяет перечень по аналогии с v1.1 §14.4.
# Смена перечня — major реестра: 0.1 → 1.0; потребитель с поддержкой 0.x
# обязан отвергнуть 1.0 до разбора тела (контракт §9).
kinds:
  - CAPABILITY_SEMANTICS
  - SERVICE_CAPABILITY_MAPPING
  - DURATION
  - EVENT_WINDOW
  - MIN_INTERVAL
  - MAX_INTERVAL
  - REPETITION
  - SEQUENCE
  - PRECONDITION
  - COMPATIBILITY
  - INCOMPATIBILITY
  - RECOVERY_WINDOW
  - SAFETY_CONSTRAINT
  - PLAN_CADENCE

# Закрытый перечень статусов записи (направление владельца 08.09.2026).
#   KNOWN                    — правило есть, значение и unit заполнены;
#   UNKNOWN                  — значение отсутствует как факт; value обязан
#                              нести reason/asked_source/as_of (контракт §4.1);
#   INTENTIONALLY_UNSUPPORTED — тип пуст по принятому решению владельца,
#                              а не потому, что работу забыли выполнить.
statuses:
  - KNOWN
  - UNKNOWN
  - INTENTIONALLY_UNSUPPORTED

# Закрытый перечень причин UNKNOWN (контракт §4.2).
unknown_reasons:
  - NO_RULE_EXISTS
  - RULE_NOT_APPLICABLE
  - SOURCE_UNREACHABLE
  - SOURCE_STALE
  - MAPPING_MISSING
  - POLICY_WITHHELD

