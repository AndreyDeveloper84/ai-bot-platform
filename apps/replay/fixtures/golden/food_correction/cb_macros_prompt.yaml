name: food_correction_cb_macros
description: ✏️ → Макросы → prompt for slash-separated triple.
input:
  channel: max
  text: "cb:food:correct:macros:scan-1"
  # The prompt is only asked when the card it corrects is still known
  # (DRF-1454): the scanner stashes it under this key when rendering.
  # Without the stash the honest answer is the stale-card refusal.
  skill_state:
    food_scan:
      scan_id: scan-1
      dish: борщ
must_pass:
  - response_contains_any:
      - макрос
      - белк
      - жир
voice_check:
  max_length: 250
  caps_lock: 0.5
