name: food_correction_cb_name
description: ✏️ → Название → prompt to retype dish name.
input:
  channel: max
  text: "cb:food:correct:name:scan-1"
  # The prompt is only asked when the card it corrects is still known
  # (DRF-1454): the scanner stashes it under this key when rendering.
  # Without the stash the honest answer is the stale-card refusal.
  skill_state:
    food_scan:
      scan_id: scan-1
      dish: борщ
must_pass:
  - response_contains_any:
      - напиши
      - название
      - было
voice_check:
  max_length: 200
  caps_lock: 0.5
