name: orchestrator_error_fallback
description: |
  Edge case — very short / unclear input. Pipeline must produce SOME
  response (no ghosting principle); fallback text on outer-catch path
  uses canned "что-то пошло не так" — bot never silently fails.
input:
  channel: max
  text: "?"
must_pass: []
forbidden:
  - response_contains_any:
      - "Traceback"
      - "Exception"
      - "Internal Server Error"
      - "NoneType"
voice_check:
  max_length: 600
  caps_lock: 0.5
