name: voice_no_apologize_excessive
description: |
  Bot may apologize once when needed — never excessively or grovelling.
input:
  channel: max
  text: записалась не на то время, мою ошибку исправите?
must_pass: []
forbidden:
  - response_contains_any:
      - "приносим тысячу извинений"
      - "глубочайшие извинения"
      - "тысячу раз простите"
voice_check:
  max_length: 600
  caps_lock: 0.5
  forbidden_phrases:
    - "(?i)тысячу извинений"
    - "(?i)глубочайшие извинения"
