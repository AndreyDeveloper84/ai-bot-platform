name: voice_no_internal_slot_word
description: |
  Человек пишет «слоты» — Ayla отвечает без этого слова (DRF-2600).
  Решение владельца 28.09, п.10 (docs/OWNER_WORDS_DECISIONS_2026-09-28.md):
  внутренние технические термины, включая «слот», не выводить на
  пользовательские поверхности. Слово стоит в `forbidden_in_reply`, а не в
  `forbidden`: оно есть во входе, и контракт `forbidden` («не пересекается
  со входом») его бы отверг. Предел: ответ здесь даёт модель — гейт живого
  пути этот ход не гейтит, он назван в списке ходов модели.
input:
  channel: max
  text: Есть свободные слоты на завтра после обеда?
must_pass: []
forbidden_in_reply:
  - response_contains_any:
      - "слот"
voice_check:
  max_length: 600
