# ai-bot-platform — STAGING override (single VPS, next to Ayla on :8000).
#
# Usage:
#   docker compose -p ayla-bot-staging \
#     -f docker-compose.yml -f docker-compose.staging.yml up -d
#
# Пересборка НА ПИЛОТЕ — через резолвер базового слоя (DRF-1440), иначе
# каждая сборка идёт в Docker Hub, чей анонимный token-endpoint с этого IP
# отвечает через раз (измерения — в шапке Dockerfile):
#
#   export PYTHON_BASE_IMAGE="$(DOCKER_CMD='sudo docker' bash scripts/resolve-base-image.sh)"
#   sudo env PYTHON_BASE_IMAGE="$PYTHON_BASE_IMAGE" docker compose -p ayla-bot-staging \
#     -f docker-compose.yml -f docker-compose.staging.yml \
#     build web worker shadow-worker celery-worker celery-beat
#
# `sudo env ...`, а не просто `export`: sudo сбрасывает окружение
# (env_reset), и compose под root не увидел бы переменную — интерполяция
# молча вернулась бы к Docker Hub.
#
# Project-prefixed (`-p ayla-bot-staging`) so volumes/networks are
# isolated from any other stack on the host automatically.
#
# Env: `.env.staging` (NOT the shared .env) — names without values in
# `.env.staging.template`; the file itself stays out of git.
#
# Host profile: 2 CPU / 8 GB / shared with Ayla → lean profile:
# uvicorn instead of runserver, celery concurrency=2, one beat, no
# chromadb (out of the sprint's critical path — if a code path hard-
# requires it, surface the fact to the orchestrator instead of
# silently enabling).

# Shared staging env for all app services (YAML anchor).
x-staging-app-env: &staging_app_env
  DJANGO_SETTINGS_MODULE: config.settings.staging
  DJANGO_ENV: staging
  DJANGO_DEBUG: "False"
  PYTHONUNBUFFERED: "1"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ai_bot_platform
  POSTGRES_USER: platform
  POSTGRES_PASSWORD: platform  # dev-stack dummy default, same as docker-compose.yml  # pragma: allowlist secret
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin  # dev-stack dummy default, same as docker-compose.yml  # pragma: allowlist secret
  S3_REPLAY_BUCKET: ai-bot-replay

services:
  # ------------------------------------------------------------------
  # Django web — uvicorn (ASGI), staging settings.
  # NOTE: brief said gunicorn; gunicorn is NOT in project deps (uv.lock)
  # nor the image — uvicorn[standard] is present (chromadb transitive)
  # and fills the same role. Deviation reported to the orchestrator.
  # ------------------------------------------------------------------
  web:
    command: >
      uvicorn config.asgi:application
      --host 0.0.0.0 --port 8000 --workers 2 --timeout-keep-alive 30
    environment: *staging_app_env
    env_file:
      - .env.staging
    # 8000 is Ayla's on this host — bot binds 8001, loopback only.
    # (!override replaces the dev stack's port list — compose
    # CONCATENATES ports across override files; !override wins.)
    ports: !override
      - "127.0.0.1:8001:8000"
    volumes:
      - ./:/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # chromadb (dev-file entry) is profiled out below — mark the
      # dependency optional so the project model still validates.
      chromadb:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # MAX DM stream consumer (XREADGROUP drain of ingress:max).
  worker:
    environment: *staging_app_env
    env_file:
      - .env.staging
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Shadow worker (Live Shadow Stage 1) — the `shadow` Celery queue.
  #
  # DRF-1447. This stanza is not decoration: without it the service is
  # still STARTED (compose brings up every service in the merged model,
  # and `shadow-worker` is defined in docker-compose.yml), but it is
  # started on the BASE file's dev settings and never sees
  # `.env.staging` at all. Measured on the pilot 2026-09-03,
  # `docker exec ayla-bot-staging-shadow-worker-1 printenv`:
  #
  #     DJANGO_SETTINGS_MODULE = config.settings.local
  #     DJANGO_DEBUG           = True
  #
  # while `web` next to it had `config.settings.staging` / `False`.
  #
  # A service is only reached by `env_file:` / `environment:` that its
  # OWN stanza declares. `x-staging-app-env` is a YAML anchor, not a
  # default: it is spliced where it is written, so a service nobody
  # wrote it into gets nothing from this file. `worker` above looks
  # like it is inheriting the staging profile; it is not — it is
  # inheriting `build`/`command`/`volumes` from docker-compose.yml and
  # declaring its env HERE. Copy that shape for every app service.
  #
  # What DEBUG=True costs on a contour with real traffic:
  #   * an unhandled exception renders Django's technical 500 page,
  #     which prints every local variable in every frame — tokens,
  #     init-data payloads, client phone numbers;
  #   * `django.db.connection.queries` accumulates every SQL statement
  #     with its parameters, unbounded, in a process that runs for
  #     weeks.
  #
  # Consequently this service is UNSAFE to run on the pilot until this
  # stanza is applied — see `tests/test_staging_stack_completeness.py`,
  # which fails if any Django service in the base file is missing here.
  #
  # `build` / `command` / `volumes` / `depends_on` come from
  # docker-compose.yml (same service name, same image) — only the env
  # differs per contour, exactly as for `worker`.
  # ------------------------------------------------------------------
  shadow-worker:
    environment: *staging_app_env
    env_file:
      - .env.staging
    restart: unless-stopped

  # Celery worker — general tasks (reminders dispatch, followups, sync).
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      # DRF-1440 — см. `web` в docker-compose.yml.
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: celery -A config worker --loglevel=INFO --concurrency=2
    environment: *staging_app_env
    env_file:
      - .env.staging
    volumes:
      - ./:/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery beat — DatabaseScheduler. Without it R1 reminders (T-24h/T-2h)
  # never fire. ONE beat per environment — do not scale this service.
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      # DRF-1440 — см. `web` в docker-compose.yml.
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: >
      celery -A config beat --loglevel=INFO
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment: *staging_app_env
    env_file:
      - .env.staging
    volumes:
      - ./:/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ------------------------------------------------------------------
  # Infra — internal only (this host's 5432/6379 belong to Ayla).
  # ------------------------------------------------------------------
  postgres:
    ports: !override []

  redis:
    ports: !override []

  minio:
    ports: !override
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"

  # chromadb is OUT of the sprint's critical path — kept behind an
  # inert profile so a plain `up -d` never starts it. If a code path
  # proves to require it, that's an orchestrator decision, not a
  # silent flip here.
  chromadb:
    profiles: ["off"]
