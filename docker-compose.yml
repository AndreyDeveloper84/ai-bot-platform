# ai-bot-platform — Sprint 0 dev stack.
#
# Brings up 6 services: web, worker, postgres 16, redis 7, chromadb, minio.
# All persistent state lives in named volumes — `docker compose down`
# preserves data; `docker compose down -v` is the explicit reset.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_bot_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d ai_bot_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  chromadb:
    image: chromadb/chroma:0.5.20
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      # Sprint 7 / M4 (DRF-595) — Bearer-token auth. Empty token in
      # local dev means anonymous access is still allowed (provider
      # falls back to no-auth when CHROMA_AUTH_TOKEN is unset). In
      # staging / prod ``CHROMA_AUTH_TOKEN`` MUST be non-empty; the
      # platform settings.production fail-fast enforces it. The
      # heartbeat probe stays unauthenticated by design (built-in
      # /api/v2/heartbeat is allow-listed by chromadb's token authn
      # middleware).
      CHROMA_SERVER_AUTHN_PROVIDER: "${CHROMA_SERVER_AUTHN_PROVIDER:-chromadb.auth.token_authn.TokenAuthenticationServerProvider}"
      CHROMA_SERVER_AUTHN_CREDENTIALS: "${CHROMA_AUTH_TOKEN:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # DRF-1440. Из какого реестра приезжает базовый слой. Умолчание —
        # апстримная ссылка на Docker Hub, поэтому свежий клон, ноутбук и
        # CI не меняются ничем. Сборка на пилоте экспортирует
        # PYTHON_BASE_IMAGE=<ссылка на GHCR> перед `docker compose build`
        # (scripts/docker-build.sh), потому что пилот достаёт Hub плохо —
        # измерения в шапке Dockerfile.
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_bot_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      REDIS_URL: redis://redis:6379/0
      CHROMA_HTTP_HOST: chromadb
      CHROMA_HTTP_PORT: "8000"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REPLAY_BUCKET: ai-bot-replay
      ORCHESTRATOR_SHADOW_ENABLED: ${ORCHESTRATOR_SHADOW_ENABLED:-false}
      ORCHESTRATOR_SHADOW_SAMPLE_RATE: ${ORCHESTRATOR_SHADOW_SAMPLE_RATE:-0.0}
      ORCHESTRATOR_SHADOW_SURFACES: ${ORCHESTRATOR_SHADOW_SURFACES:-global}
      ORCHESTRATOR_SHADOW_MAX_BACKLOG: ${ORCHESTRATOR_SHADOW_MAX_BACKLOG:-500}
      ORCHESTRATOR_SHADOW_TIMEOUT_MS: ${ORCHESTRATOR_SHADOW_TIMEOUT_MS:-2500}
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      minio:
        condition: service_healthy

  # MAX DM consumer (#1010). Drains the `ingress:max` Redis stream into the
  # handler pipeline via XREADGROUP; without it MAX DM webhooks are accepted
  # and journaled but never processed. Same image/env as `web`, no ports
  # (not an HTTP service). The Mini App booking path is synchronous HTTP on
  # init-data auth and does NOT need this worker.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      # DRF-1440 — см. `web` в docker-compose.yml.
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: python -m apps.workers.consumer --forever
    # A drainer that dies silently re-creates the #1010 symptom (stream
    # accepted but never processed). --forever exits cleanly on SIGINT; any
    # other unhandled error should bounce the container back up.
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_bot_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      REDIS_URL: redis://redis:6379/0
      CHROMA_HTTP_HOST: chromadb
      CHROMA_HTTP_PORT: "8000"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REPLAY_BUCKET: ai-bot-replay
      ORCHESTRATOR_SHADOW_ENABLED: ${ORCHESTRATOR_SHADOW_ENABLED:-false}
      ORCHESTRATOR_SHADOW_SAMPLE_RATE: ${ORCHESTRATOR_SHADOW_SAMPLE_RATE:-0.0}
      ORCHESTRATOR_SHADOW_SURFACES: ${ORCHESTRATOR_SHADOW_SURFACES:-global}
      ORCHESTRATOR_SHADOW_MAX_BACKLOG: ${ORCHESTRATOR_SHADOW_MAX_BACKLOG:-500}
      ORCHESTRATOR_SHADOW_TIMEOUT_MS: ${ORCHESTRATOR_SHADOW_TIMEOUT_MS:-2500}
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Shadow worker (Live Shadow Stage 1): drains the dedicated `shadow`
  # Celery queue for the observe-only orchestrator.shadow_turn task.
  # Isolated from the production Celery worker and the MAX DM stream
  # consumer by design — it must never share their bounded pools.
  shadow-worker:
    build:
      context: .
      dockerfile: Dockerfile
      # DRF-1440 — см. `web` в docker-compose.yml.
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: celery -A config worker --loglevel=INFO -Q shadow --concurrency=2 --prefetch-multiplier=1
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_bot_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      REDIS_URL: redis://redis:6379/0
      CHROMA_HTTP_HOST: chromadb
      CHROMA_HTTP_PORT: "8000"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REPLAY_BUCKET: ai-bot-replay
      ORCHESTRATOR_SHADOW_ENABLED: ${ORCHESTRATOR_SHADOW_ENABLED:-false}
      ORCHESTRATOR_SHADOW_SAMPLE_RATE: ${ORCHESTRATOR_SHADOW_SAMPLE_RATE:-0.0}
      ORCHESTRATOR_SHADOW_SURFACES: ${ORCHESTRATOR_SHADOW_SURFACES:-global}
      ORCHESTRATOR_SHADOW_MAX_BACKLOG: ${ORCHESTRATOR_SHADOW_MAX_BACKLOG:-500}
      ORCHESTRATOR_SHADOW_TIMEOUT_MS: ${ORCHESTRATOR_SHADOW_TIMEOUT_MS:-2500}
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  minio_data:
