# ai-bot-platform — Sprint 0 dev stack.
#
# Brings up 5 services: web, postgres 16, redis 7, chromadb, minio.
# All persistent state lives in named volumes — `docker compose down`
# preserves data; `docker compose down -v` is the explicit reset.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_bot_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d ai_bot_platform"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  chromadb:
    image: chromadb/chroma:0.5.20
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      # Sprint 7 / M4 (DRF-595) — Bearer-token auth. Empty token in
      # local dev means anonymous access is still allowed (provider
      # falls back to no-auth when CHROMA_AUTH_TOKEN is unset). In
      # staging / prod ``CHROMA_AUTH_TOKEN`` MUST be non-empty; the
      # platform settings.production fail-fast enforces it. The
      # heartbeat probe stays unauthenticated by design (built-in
      # /api/v2/heartbeat is allow-listed by chromadb's token authn
      # middleware).
      CHROMA_SERVER_AUTHN_PROVIDER: "${CHROMA_SERVER_AUTHN_PROVIDER:-chromadb.auth.token_authn.TokenAuthenticationServerProvider}"
      CHROMA_SERVER_AUTHN_CREDENTIALS: "${CHROMA_AUTH_TOKEN:-}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ai_bot_platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      REDIS_URL: redis://redis:6379/0
      CHROMA_HTTP_HOST: chromadb
      CHROMA_HTTP_PORT: "8000"
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REPLAY_BUCKET: ai-bot-replay
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  chromadb_data:
  minio_data:
