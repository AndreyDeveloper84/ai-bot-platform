# Sprint 8 / N1 (DRF-700) — Edge nginx tee for MAX webhook.
#
# Splits inbound MAX webhook traffic between two upstreams:
#
#   * PRIMARY  → mysite/maxbot/ (legacy, still source-of-truth)
#   * SHADOW   → ai-bot-platform/ (Sprint 8 observation; no outbound to user)
#
# The shadow side runs under `is_shadow=True` so the platform pipeline
# writes Conversation/Message rows and audit/replay for the daily delta
# (S3 / DRF-718) but skips outbound (S2 / DRF-717).
#
# ## Emergency disable
#
# Comment out `mirror /shadow;` and reload:
#   sudo nginx -t && sudo systemctl reload nginx
# Platform stops receiving webhook copies immediately. Primary path is
# unaffected — even the shadow infrastructure failing has zero impact
# on the user-facing reply.
#
# ## Why mirror + not split_clients
#
# `mirror` is asynchronous — the primary response is sent BEFORE nginx
# waits on the mirror upstream. A slow / failing platform cannot delay
# MAX's response. `split_clients` would route a subset of users to one
# or the other; that's a CANARY mode, not a SHADOW mode.

upstream mysite_maxbot {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream ai_bot_platform_shadow {
    server 127.0.0.1:8003;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name app.penza.taxi;

    # SSL config inherits from sites-available/penza-taxi-base.conf
    include /etc/nginx/sites-available/penza-taxi-base.conf;

    # Health probe — NEVER mirror. Some monitors POST here.
    location = /api/maxbot/health {
        proxy_pass http://mysite_maxbot;
    }

    # The hot path: MAX webhook.
    location = /api/maxbot/webhook/ {
        # Shadow mirror MUST come BEFORE proxy_pass — nginx evaluates
        # `mirror` against the upstream before the primary completes.
        mirror /shadow;
        mirror_request_body on;

        # Primary — response goes to MAX.
        proxy_pass http://mysite_maxbot;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Internal mirror endpoint — `internal` ensures it can't be hit
    # from the public internet.
    location = /shadow {
        internal;
        proxy_pass http://ai_bot_platform_shadow/api/maxbot/webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Max-Bot-Api-Secret $http_x_max_bot_api_secret;
        # The marker N2 (DRF-701) reads off the request to set
        # ChannelMessage.is_shadow=True.
        proxy_set_header X-Shadow "1";
        # Shadow path is best-effort: 5s timeout, no retries — a slow
        # platform should NEVER backpressure the primary write.
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
    }
}
