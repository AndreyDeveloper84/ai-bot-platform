[project]
name = "ai-bot-platform"
version = "0.1.0"
description = "Multi-tenant AI bot platform — Phase 0"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [
    { name = "AndreyDeveloper84" },
]

# Sprint 0 / A3 (DRF-405): full production deps. Lockfile is `uv.lock`.
#
# Deviations from the original ticket spec, with rationale:
#   - psycopg[binary]>=3.2 instead of psycopg2-binary>=2.9.
#       Django 4.2+ recommends psycopg 3; the docker stack already uses it
#       (DRF-404). Switching back would be a regression.
#   - django-cryptography-django5==2.2 instead of django-cryptography==2.2.
#       The original `django-cryptography` is abandoned at 1.1 and does not
#       support Django 5. The actively-maintained Django-5 fork publishes
#       under `django-cryptography-django5`. Same code, same API. ADR-0006
#       to be updated in DRF-413.
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "celery[redis]>=5.4",
    # Database-backed scheduler for celery beat. Required by
    # config.settings.base INSTALLED_APPS + the systemd beat command
    # `--scheduler django_celery_beat.schedulers:DatabaseScheduler`.
    "django-celery-beat>=2.7",
    "redis>=5.0",
    # Issue #552 — django-redis backend for the Django CACHES framework.
    # Required because:
    #   * Rate limiters (apps.master_api.services.ai_draft_limits) and DM
    #     idempotency locks (apps.admin_api.tasks) depend on cross-worker
    #     atomic SETNX/INCR semantics. Django's built-in locmem cache is
    #     per-worker and silently bypasses these guards (each worker has
    #     its own counter → effective limit = N × configured limit).
    #   * apps.skills.faq.tools.invalidate_kb_search_cache uses the
    #     ``delete_pattern`` extension, a django-redis-specific API.
    # The boot assertion in apps.master_api.apps fails fast in production
    # when the configured BACKEND is not a Redis backend.
    "django-redis>=5.4",
    "psycopg[binary]>=3.2",
    "chromadb>=0.5",
    "openai>=1.50",
    "anthropic>=0.40",
    "httpx>=0.27",
    "django-cryptography-django5==2.2",
    "python-dotenv>=1.0",
    # Sprint 8 / T1 (DRF-705) — OpenTelemetry.
    # Pin the API + SDK + OTLP/gRPC exporter as a set. The SDK refuses
    # to start under mismatched API/SDK majors; pinning the set avoids
    # a transitive surprise during a security-fix CI run.
    "opentelemetry-api>=1.26,<2",
    "opentelemetry-sdk>=1.26,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.26,<2",
    # Sprint 8 / E1 (DRF-710) — Sentry error reporting with PII scrubber.
    # Pinned to v2+ for the modern `before_send` semantics and
    # CeleryIntegration's beat-aware tagging.
    "sentry-sdk[django,celery]>=2.0,<3",
    # KB-RAG Sub-4b (GH #128) — Google Docs read-only client.
    # Pivoted from service-account auth to the public Markdown export
    # endpoint (`/document/d/<id>/export?format=md`) because operator GCP
    # orgs increasingly enforce `iam.disableServiceAccountKeyCreation`
    # ("Secure by Default") which blocks JSON key generation. Source docs
    # are link-shareable; no auth needed. httpx is already a project dep.
    # KB-RAG Sub-5 (GH #118) — deterministic Russian → ASCII transliteration
    # for the slug used in KbDocument.source_uri. Pure-Python, zero deps,
    # MIT-licensed. Runtime dep (not dev-only) because the slug builder is
    # called inside the seed_kb_from_gdocs management command which runs in
    # production environments — never in tests alone.
    "transliterate>=1.10",
    # PR #524 round-1 A2 — per-IP rate limit on the cross-service
    # events ingest endpoint. Used by
    # apps.eventbus.views.InternalEventsIngestView via
    # @method_decorator(ratelimit(...)). Production deploys may
    # disable via RATELIMIT_ENABLE=False when WAF/CDN-level limits
    # are deployed at the edge.
    "django-ratelimit>=4.1,<5",
]

[project.optional-dependencies]

# ayla-ai-core is a separate private repo. Pulling it requires GitHub
# auth (locally via ssh, in CI via a GH_DEPLOY_TOKEN secret + `git
# config insteadOf` rewrite — see .github/workflows/ci.yml). It lives
# in its own extra so plain `uv sync --extra dev` works without auth
# for non-AI contributors. AI work uses `uv sync --extra dev --extra ai-core`.
#
# A2 / DRF-618: ref pinned to a 40-char commit SHA, NOT a tag. Tags are
# force-pushable on GitHub (Security Engineer P1, 2026-05-12 six-agent
# review). A SHA pin is immutable — even if `git tag -f v0.7.0` runs
# upstream, the resolved package never changes silently. uv.lock pins
# the same SHA; CI's `--frozen` flag makes silent drift a hard failure.
#
# Bump procedure:
#   1. Read upstream CHANGELOG.md for breaking changes against the
#      allow-list (Sprint 7 / Decision 1): `BrandVoiceConfig`, `Example`,
#      `SpecialistContext`, `tools.ActionType`, `render_system_prompt`
#      (escape_for_format default), and any new mandatory kwargs.
#   2. Capture target SHA: `cd ~/PycharmProjects/ayla-ai-core && git rev-parse vX.Y.Z`.
#   3. Replace the @<SHA> below.
#   4. `uv lock --upgrade-package ayla-ai-core`
#   5. Run `tests/smoke/test_ayla_import.py` — update the version
#      assertion to match the new release. The SHA-pin guard
#      (`test_package_sha_pinned`) auto-reads this file и will fail
#      if `uv.lock` drifts from `pyproject.toml`.
#   6. PR title: `chore(deps): bump ayla-ai-core <prev> → vX.Y.Z (SHA <short>)`.
#
# Cross-repo joint-bump (Block A9 — maintainability roadmap):
#   ayla-ai-core has TWO consumer repos in production — this one
#   (`ai-bot-platform`) and `Ayla/djangoproject`. They MUST pin the
#   IDENTICAL SHA or behaviour diverges between the AI runtime and
#   the canonical state-of-record. The two bumps ship as a PAIR:
#
#     - bot-platform PR: edits this file + `uv.lock`.
#     - Ayla djangoproject PR: edits `requirements.txt` to the same SHA.
#     - Both PRs cross-reference each other in the description.
#     - Land-order: merge bot-platform first (this CI runs faster);
#       Ayla merge follows immediately so production deploys converge.
#
#   ENFORCEMENT SCOPE (adversarial CR H3, 2026-06-01): only the
#   INTRA-repo invariant is CI-gated. `tests/smoke/test_ayla_import.py
#   ::test_package_sha_pinned` asserts this file's pin ↔ installed
#   `direct_url.json` SHA. There is NO CI gate that fetches
#   Ayla djangoproject's `requirements.txt` to verify cross-repo
#   alignment from this side. Cross-repo SHA convergence is
#   OPERATIONAL — ops grep both production container streams для
#   `orchestrator.ayla_ai_core.boot` (this repo) and the analogous
#   Ayla boot log to confirm. A proper cross-repo CI gate is a
#   Phase-1 follow-up (founder discipline «stop expanding scope»).
#
#   The boot-time INFO log `orchestrator.ayla_ai_core.boot
#   version=<X.Y.Z> source=<url>@<sha>` (apps/orchestrator/apps.py)
#   surfaces the resolved SHA in container stdout — ops grep both
#   log streams to confirm convergence without shelling into either
#   runtime.
#
#   BUMP CHECKLIST UPDATE (when bumping ayla-ai-core):
#     - Update the @<SHA> below.
#     - Update `tests/smoke/test_ayla_import.py::test_package_version_pinned`
#       assertion to the new version string.
#     - `apps/orchestrator/tests/test_apps_boot_log.py::test_boot_log_emits_version`
#       reads the live version via importlib.metadata — no manual edit needed.
#
# Current: v0.9.0 + feat/memory-provenance — memory context builder: exports
# ``build_memory_block`` from the package root (S3.5 concierge memory
# injection, W5), plus the P0-3 fact-provenance surface
# (``sources=``, ``SOURCE_STATED``/``SOURCE_INFERRED``, ``INFERRED_MARK``,
# ``MEMORY_INFERRED_HEADER``) that lets the prompt tell a quote from a
# derivation. Snapshot-tested upstream; additive against the v0.8.x
# allow-list (new kwarg is keyword-only with a None default; callers that
# omit it get byte-identical output).
#
# CHANGELOG: https://github.com/AndreyDeveloper84/ayla-ai-core/blob/main/CHANGELOG.md
ai-core = [
    "ayla-ai-core[django] @ git+https://github.com/AndreyDeveloper84/ayla-ai-core.git@ee6425ac90f6f4e2e0d899c22ebe981ae3b623e1",
]

dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "pytest-asyncio>=1.0",
    "pytest-cov",
    "model-bakery>=1.20",
    "ruff>=0.6",
    "mypy>=1.10",
    "django-stubs[compatible-mypy]",
    "types-requests",
    "pytest-httpx",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
    "freezegun>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
# Tests live in two places by design:
#   tests/              — cross-cutting (smoke, integration, e2e, contract, leakage scanner)
#   apps/<name>/tests/  — per-app unit tests (live next to the code)
testpaths = ["tests", "apps"]
# Defence in depth: never wander into legacy_*/ or other build artefacts.
norecursedirs = [
    "legacy_maxbot",
    "legacy_formulatela_mcp",
    "legacy_notifications",
    ".venv",
    ".git",
    "node_modules",
    "*.egg",
    "build",
    "dist",
]
# pytest-asyncio: explicit marker mode. Coroutine tests must be decorated
# with @pytest.mark.asyncio (no implicit auto-collection of async funcs).
asyncio_mode = "strict"
# `-p config.pytest_env_guard` (DRF-1384) — environment-vs-pin gate. Loaded
# here rather than from a root conftest.py because pytest-django calls
# `django.setup()` inside `pytest_load_initial_conftests`, i.e. BEFORE any
# conftest is imported: a stale `ayla-ai-core` blows up populating the app
# registry, long before a conftest hook could say why. Rationale in full:
# config/pytest_env_guard.py. Bypass with AYLA_ENV_GUARD=off.
addopts = "-p config.pytest_env_guard -q -m \"not smoke\""
markers = [
    "e2e: end-to-end test requiring real Redis + Postgres (CI services or docker compose locally). Skipped automatically when backing services aren't reachable.",
    "slow: opt-in performance / latency-SLO tests. Excluded from the default suite (`-m \"not slow\"`); run via `pytest -m slow` in nightly perf jobs.",
    "smoke: opt-in smoke test that hits real seeded ChromaDB + real OpenAI (KB-RAG Sub-6 / GH #119). Excluded from the default suite (`-m \"not smoke\"`); run via `pytest -m smoke apps/kb/services/tests/test_global_fallback_smoke.py -v` after seeding the `global_kb` corpus.",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# legacy_*/ are AS-IS migration sources — they follow the source repo's
# style, not the platform's. Drained sprint-by-sprint into apps/.
extend-exclude = ["legacy_maxbot", "legacy_formulatela_mcp", "legacy_notifications"]

[tool.ruff.lint]
# TID251 = banned-api / banned-module-level-imports. Stops apps/ from
# accidentally pulling legacy_* code while migration is in flight.
# Override per-line with `# noqa: TID251` only for transitional glue
# documented in legacy_*/MIGRATION_NOTICE.md (must include `# TODO(sprint N)`).
extend-select = ["TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"legacy_maxbot".msg = "legacy_maxbot is read-only migration reference. Build new code in apps/. Transitional glue requires `# noqa: TID251` + `# TODO(sprint N)` per legacy_maxbot/MIGRATION_NOTICE.md."
"legacy_formulatela_mcp".msg = "legacy_formulatela_mcp is read-only migration reference. New code goes in apps/kb/."
"legacy_notifications".msg = "legacy_notifications is read-only migration reference. New code goes in apps/channels/."

[tool.mypy]
python_version = "3.12"
strict = false
plugins = ["mypy_django_plugin.main"]
exclude = ["^legacy_maxbot/", "^legacy_formulatela_mcp/", "^legacy_notifications/"]

[tool.django-stubs]
django_settings_module = "config.settings.local"
