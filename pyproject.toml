[project]
name = "ai-bot-platform"
version = "0.1.0"
description = "Multi-tenant AI bot platform — Phase 0 scaffold (Sprint 0)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [
    { name = "AndreyDeveloper84" },
]

# Sprint 0 / A1 keeps this minimal. Full pinned deps + lockfile land in DRF-405 (A3).
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.local"
