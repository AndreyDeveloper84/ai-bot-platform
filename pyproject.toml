[project]
name = "ai-bot-platform"
version = "0.1.0"
description = "Multi-tenant AI bot platform — Phase 0"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
authors = [
    { name = "AndreyDeveloper84" },
]

# Sprint 0 / A3 (DRF-405): full production deps. Lockfile is `uv.lock`.
#
# Deviations from the original ticket spec, with rationale:
#   - psycopg[binary]>=3.2 instead of psycopg2-binary>=2.9.
#       Django 4.2+ recommends psycopg 3; the docker stack already uses it
#       (DRF-404). Switching back would be a regression.
#   - django-cryptography-django5==2.2 instead of django-cryptography==2.2.
#       The original `django-cryptography` is abandoned at 1.1 and does not
#       support Django 5. The actively-maintained Django-5 fork publishes
#       under `django-cryptography-django5`. Same code, same API. ADR-0006
#       to be updated in DRF-413.
dependencies = [
    "django>=5.2,<6.0",
    "djangorestframework>=3.15",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "chromadb>=0.5",
    "openai>=1.50",
    "httpx>=0.27",
    "django-cryptography-django5==2.2",
    "ayla-ai-core @ git+https://github.com/AndreyDeveloper84/ayla-ai-core.git@v0.6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.11",
    "pytest-asyncio>=1.0",
    "pytest-cov",
    "model-bakery>=1.20",
    "ruff>=0.6",
    "mypy>=1.10",
    "django-stubs[compatible-mypy]",
    "pytest-httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.local"
